# `spark-ffi` — the control-plane backend binding. Exposes a typed `Backend` over the `spark-ipc`
# control client as UniFFI-generated Swift/Kotlin, so any UI drives a running `spark-service`
# through one API (superseding the CLI's hand-written control client). Control surface only — the
# data path stays in the platform shims (`platforms/android`, `platforms/apple`). `uniffi` is
# isolated here and is never linked into the `core`/`cli`/`service` binaries.
[package]
name = "spark-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "spark_ffi"
# `cdylib` for Android (System.loadLibrary) + the host build the bindgen reads; `staticlib` for the
# Apple xcframework; `lib` so the Rust integration test (and the bindgen bin) can link the crate.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# The GUI-agnostic backend (the typed control logic); this crate is just its UniFFI binding.
spark-backend = { path = "../spark-backend" }
# The wire types this binding mirrors into UniFFI records/enums (the `From<spark_ipc::*>` impls).
spark-ipc = { path = "../ipc" }
uniffi.workspace = true
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The control e2e test mints `spark_backend::BackendError`s to check the 1:1 `From` mirror, and
# drives the mock service over `spark-ipc`'s wire helpers directly.
spark-backend = { path = "../spark-backend" }

[features]
# Pulls UniFFI's bindgen CLI for the `uniffi-bindgen` bin only — kept off the default lib build so
# the shipped cdylib/staticlib never drags `uniffi_bindgen` + its host-only deps into an iOS/Android
# cross-compile. Enable only when running the generator: `--features uniffi-bindgen`.
uniffi-bindgen = ["uniffi/cli"]

# The bindings generator (run with the feature):
#   cargo run -p spark-ffi --features uniffi-bindgen --bin uniffi-bindgen -- generate ...
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]
