# Example spark-service configuration.
# Install to /etc/spark/config.toml, adjust for your host, and reference it with --config.
# Every field has a default, so anything you omit falls back; unknown keys are rejected.

[tun]
addr = "10.0.0.1"
prefix = 24
# name = "utun9"   # requested device name; the OS may assign a different one
# mtu = 1500       # omit to use the device default
# stack = "userspace"  # which netstack terminates TCP. "userspace" (default) = the cross-platform
#                      # smoltcp stack. "system" = kernel TCP via a NAT redirect gateway (sing-box's
#                      # `system`): higher throughput, no multi-flow download collapse, but desktop-
#                      # only (Linux/macOS) and requires a build with the `system-stack` feature.

[transport]
# Pin the daemon's upstream dials to your physical egress interface so they bypass the tunnel
# route (REQUIRED on macOS to avoid a forwarding loop; recommended on Linux). Set to your
# internet-facing NIC:
#   macOS:  route -n get default | awk '/interface:/{print $2}'   (often en0)
#   Linux:  ip route show default | awk '{print $5; exit}'        (often eth0 / wlan0)
protect_interface = "en0"
# server = "203.0.113.1:8388"   # tunnel through a server; omit to dial destinations directly

# AnyTLS transport (requires a build with the `anytls` feature). When set, it takes precedence
# over the plain `server` tunnel above and carries both TCP and UDP (UDP-over-TCP v2). It defeats
# TLS-in-TLS fingerprinting with a Chrome-mimicking BoringSSL ClientHello plus a server-pushable
# record-padding scheme. Point it at an anytls-go server.
# [transport.anytls]
# server = "203.0.113.1:8443"   # the AnyTLS server's host:port
# password = "your-shared-secret"
# sni = "www.example.com"       # TLS SNI; omit to use the server IP (set this to a real-looking host)

[udp]
idle_timeout_secs = 60   # reclaim a UDP NAT association after this much silence

[routing]
# When true, spark seizes the routing table on connect (full-tunnel) and restores/blackholes
# it on teardown — the active half of the kill-switch. When false (default), you route traffic
# into the TUN yourself (the dev-gate workflow). Needs `protect_interface` set above so the
# daemon's own dials bypass the tunnel.
manage = false

[kill_switch]
# Only meaningful with [routing] manage = true. false (default) = fail OPEN: if the data path
# dies, restore direct routing (loudly) so the network keeps working. true = fail CLOSED:
# blackhole traffic instead of leaking it directly.
fail_closed = false

[log]
debug = false   # keep false in production — addresses are redacted at the default level
