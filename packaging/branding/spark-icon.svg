<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18d4ea"/>
      <stop offset="1" stop-color="#009cb4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="0.55" stop-color="#f8bd10"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#003a44" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- squircle background -->
  <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#bg)"/>
  <!-- top sheen -->
  <rect x="72" y="72" width="880" height="880" rx="212" fill="url(#glow)"/>
  <!-- soft inner top highlight -->
  <path d="M284 72 H812 a140 140 0 0 1 140 140 V300 C760 150 320 150 72 320 V212 A140 140 0 0 1 212 72 Z" fill="#ffffff" opacity="0.10"/>
  <!-- lightning bolt -->
  <g filter="url(#ds)">
    <path d="M604 168
             L360 556
             L502 556
             L430 856
             L708 452
             L560 452
             L604 168 Z"
          fill="url(#bolt)"/>
    <!-- crisp top-left edge highlight on the bolt -->
    <path d="M604 168 L360 556 L502 556 L500 520 L430 520 L604 250 Z" fill="#ffffff" opacity="0.22"/>
  </g>
</svg>
