[workspace]
resolver = "2"
members = ["core", "cli", "ipc", "service", "platforms/android", "platforms/apple"]
# Kept out of the workspace on purpose:
#  - vendor/netstack-smoltcp: depended on by `path`, but its examples/tests/dev-deps
#    (tun2, structopt, socket2-ext, …) should not be built as part of our workspace.
#  - netstack-spike, circ-tool: standalone scratch crates, not part of the product.
exclude = ["vendor/netstack-smoltcp", "netstack-spike", "circ-tool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# tun-rs 2.8.x: `async` pulls the tokio-backed AsyncDevice. The framed Stream/Sink
# (`async_framed`) is added at M2 when we bridge the TUN into the netstack.
tun-rs = { version = "2.8", features = ["async"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Control-plane IPC wire codec (CLAUDE.md locked stack). `use-std` for `to_stdvec` + std error.
postcard = { version = "1", features = ["use-std"] }
# Socket protection (IP_BOUND_IF / IP_UNICAST_IF) so upstream dials bypass the tunnel route;
# `all` enables bind_device_by_index_*. `libc` for if_nametoindex (name → interface index).
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
thiserror = "2"
anyhow = "1"
# Crypto primitives (CLAUDE.md locked stack): used for the AnyTLS auth record's SHA-256 and,
# later, the rustls ring backend. NOT for MD5 (ring omits it) — the AnyTLS padding-md5 hash is
# handled separately.
ring = "0.17"

# Locked release profile (CLAUDE.md). Profiles only take effect from the workspace
# root, so they live here, not in member manifests.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
