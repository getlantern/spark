[workspace]
resolver = "2"
members = ["core", "cli", "ipc", "service", "platforms/android", "platforms/apple", "spark-backend", "spark-ffi", "spark-bridge"]
# Kept out of the workspace on purpose:
#  - vendor/netstack-smoltcp: depended on by `path`, but its examples/tests/dev-deps
#    (tun2, structopt, socket2-ext, …) should not be built as part of our workspace.
#  - netstack-spike, circ-tool: standalone scratch crates, not part of the product.
#  - gui-tauri/src-tauri: the Tauri UI shell (ADR 0008). Kept out so Tauri's large
#    dep tree never enters the core workspace graph or the size-tuned release profile;
#    it builds standalone via its own `npm run tauri build` / `cargo build`.
exclude = ["vendor/netstack-smoltcp", "netstack-spike", "circ-tool", "gui-tauri/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
tokio = { version = "1", features = ["full"] }
# `sync` (ungated) gives `PollSender`, which bridges a bounded mpsc into a `poll_*` write path so a
# `Stream`'s `poll_write` can backpressure instead of buffering unboundedly. Already in the tree
# transitively (tun-rs/netstack-smoltcp); declaring it direct promotes the locked 0.7.x, no churn.
tokio-util = "0.7"
futures = "0.3"
# tun-rs 2.8.x: `async` pulls the tokio-backed AsyncDevice. The framed Stream/Sink
# (`async_framed`) is added at M2 when we bridge the TUN into the netstack.
tun-rs = { version = "2.8", features = ["async"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Control-plane IPC wire codec (CLAUDE.md locked stack). `use-std` for `to_stdvec` + std error.
postcard = { version = "1", features = ["use-std"] }
# Socket protection (IP_BOUND_IF / IP_UNICAST_IF) so upstream dials bypass the tunnel route;
# `all` enables bind_device_by_index_*. `libc` for if_nametoindex (name → interface index).
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
thiserror = "2"
anyhow = "1"
# Crypto primitives (CLAUDE.md locked stack): used for the AnyTLS auth record's SHA-256 and,
# later, the rustls ring backend.
ring = "0.17"
# MD5 for the AnyTLS `padding-md5` settings field — a NON-security scheme identifier that `ring`
# (intentionally) omits. RustCrypto's pure-Rust crate; not used for anything security-relevant.
md-5 = "0.10"
# BoringSSL (the AnyTLS mimicry TLS backend, ADR 0001) — pulled ONLY by the `anytls` feature, so
# default builds stay rustls/ring-only. boring2/tokio-boring2 is the maintained impersonation fork.
boring2 = "4.15"
tokio-boring2 = "4.15"
# FFI access to the already-present boring2, for the Samizdat `kID` SessionID-injection seam (ADR
# 0007 §5): boring-sys2 = the raw SSL_SESSION_* symbols; foreign-types-shared = the ForeignTypeRef
# trait that provides `SslRef::as_ptr`. Pulled ONLY by the `samizdat` feature — not new external
# surface, just the FFI layer of an already-approved dependency.
boring-sys2 = "4.15"
foreign-types-shared = "0.3"
# HTTP/2 for the Samizdat CONNECT-stream mux (ADR 0007 §4). The sans-hyper `h2` crate: we drive
# SETTINGS/streams directly, no `http`-server/`tower`/openssl baggage. A scoped, documented exception
# to the no-hyper rule (H2 lives inside TLS, so its fingerprint is encrypted and not an evasion
# surface). Pulled ONLY by the `samizdat` feature.
h2 = "0.4"
# `http` request/response types for building the CONNECT request driven through `h2` (types only;
# already transitive via h2). Pulled ONLY by the `samizdat` feature.
http = "1"
# wasmi: pure-Rust, no-JIT WebAssembly interpreter — the dynamic-transport (Path B) runtime
# (ADR 0003). Pinned to the exact pre-release the design was validated against. Pulled ONLY by the
# `wasm-transport` feature, so default builds carry no WASM runtime. No-JIT → iOS-safe.
wasmi = "=2.0.0-beta.2"
# Assembles the inline WebAssembly-text fixture into module bytes for the wasm-transport tests.
# Test-only (dev-dependency); never linked into a release binary.
wat = "1"
# UniFFI: generates type-safe Swift/Kotlin bindings for the `spark-ffi` control surface (one Rust
# definition → all UI languages). Used ONLY by `spark-ffi`; never linked into the `core`/`cli`/
# `service` binaries. No features here so the shipped lib/cdylib/staticlib stays lean and
# cross-compiles clean for iOS/Android — the bindgen CLI is pulled by spark-ffi's (bin-only)
# `uniffi-bindgen` feature, and the owned-runtime model doesn't use `async_runtime = "tokio"`, so
# the `tokio` feature (its `async-compat` global runtime) is omitted too.
uniffi = { version = "0.31" }
blake3 = { version = "1", default-features = false }
aes = "0.8"
# Hysteria 2 transport (ADR 0010): QUIC client interoperable with apernet/hysteria, with
# Salamander+Gecko obfuscation. `rustls-ring` uses the ring backend (CLAUDE.md locked stack);
# `runtime-tokio` is the async runtime bridge. Off by default — only the `hysteria2` feature pulls them.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-udp = "0.5"
blake2 = { version = "0.10", default-features = false }
# Mozilla's compiled-in CA bundle for the hysteria2 `system-roots` TLS mode. Pure-Rust, identical on
# every platform (incl. Android/Apple), no OS trust-store integration. Tracks rustls-pki-types 1.x.
# Off by default — only the `hysteria2` feature pulls it.
webpki-roots = "1"
# flutter_rust_bridge: generates the Dart<->Rust bridge for the desktop Flutter GUI (`gui/`). Used
# ONLY by `spark-bridge`; never linked into core/cli/service. Pinned to EXACTLY match the codegen CLI
# (`flutter_rust_bridge_codegen`) and the Dart `flutter_rust_bridge` package — all three must be the
# same version or the generated glue mismatches the runtime at load time (not a compile error).
flutter_rust_bridge = "=2.12.0"

# Release profile. Profiles only take effect from the workspace root, so they live here, not in
# member manifests. opt-level=3 (not "z"): the netns throughput benchmark (bench/, 2026-06-17) showed
# "z" roughly HALVES data-path throughput — "z" disables the inlining/vectorization the smoltcp
# per-packet inner loop needs. opt-level=3 ~doubled it (0.81→1.61 Gb/s up) for only +540 KB (base
# build 1.26→1.80 MB, still under the original 3 MB target). Throughput is "critical" per CLAUDE.md;
# the size budget was relaxed to ~10 MB. See docs/system-stack-design.md §9.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
