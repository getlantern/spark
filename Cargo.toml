[workspace]
resolver = "2"
members = ["core", "cli", "ipc", "service"]
# Kept out of the workspace on purpose:
#  - vendor/netstack-smoltcp: depended on by `path`, but its examples/tests/dev-deps
#    (tun2, structopt, socket2-ext, …) should not be built as part of our workspace.
#  - netstack-spike, circ-tool: standalone scratch crates, not part of the product.
exclude = ["vendor/netstack-smoltcp", "netstack-spike", "circ-tool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# tun-rs 2.8.x: `async` pulls the tokio-backed AsyncDevice. The framed Stream/Sink
# (`async_framed`) is added at M2 when we bridge the TUN into the netstack.
tun-rs = { version = "2.8", features = ["async"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"

# Locked release profile (CLAUDE.md). Profiles only take effect from the workspace
# root, so they live here, not in member manifests.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
