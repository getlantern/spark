# Deploy spark's dns-tunnel-server (ADR 0011) — the clean-slate DNS-tunnel transport, a drop-in
# modernization of Lantern's dnstt escalation tier. This mirrors
# getlantern/lantern-cloud `ans/bootstrap-dnstt.yaml` (same shape: a static binary + a systemd unit +
# a :53→:5300 DNAT), swapping dnstt's Noise keypair for spark's static Ed25519 identity. It is meant to
# be lifted into lantern-cloud/ans/ alongside the dnstt playbook once reviewed.
#
# Prereqs:
#   - inventory group `spark_dns` (see inventory/spark-dns.example.yaml)
#   - a delegated tunnel zone: `t.<domain>` NS → `ns-spark.<domain>` A → the host IP.
#     Use an UNATTRIBUTABLE domain, NOT a known Lantern domain — a censor's
#     resolver is far likelier to filter a recognizable name.
#   - the cross-built static server binary at files/dns-tunnel-server
#     (`cargo zigbuild --release -p dns-tunnel-server --target x86_64-unknown-linux-musl`;
#      use aarch64-unknown-linux-musl for ARM hosts). Static musl → distro-agnostic.
#   - the server's static private key at files/spark-dns.privkey — the base64 privkey line from
#     `dns-tunnel-server keygen` (secret; mode 0600). Distribute the matching `pubkey` to clients;
#     the private key never leaves the server.
#
# Run (replace the zone with your delegated one; example.com is RFC 2606 reserved and inert):
#   ansible-playbook -i inventory/spark-dns.yaml bootstrap-spark-dns.yaml -e zone=t.example.com
- name: Deploy and start spark dns-tunnel-server
  hosts: spark_dns
  become: true
  vars:
    bind: "0.0.0.0:5300"
    idle_secs: 300
  tasks:
    - name: Require the tunnel zone
      assert:
        that:
          - zone is defined
          - zone | length > 0
        fail_msg: "pass -e zone=t.<your-domain> (an unattributable domain, not a known Lantern one)"

    - name: Config dir
      file:
        path: /etc/spark-dns
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the dns-tunnel-server binary
      copy:
        src: files/dns-tunnel-server
        dest: /usr/local/bin/dns-tunnel-server
        mode: "0755"
      notify: Restart spark-dns

    - name: Copy the server private key (secret — root-only)
      copy:
        src: files/spark-dns.privkey
        dest: /etc/spark-dns/privkey
        owner: root
        group: root
        mode: "0600"
      notify: Restart spark-dns

    # Recursive resolvers always hit :53; the server runs unprivileged on :5300 and we redirect.
    #
    # This MUST survive reboot. Without persistence the failure is silent and total: systemd brings
    # the server back on :5300, it answers correctly if you query that port, and every recursive
    # resolver in the world still gets nothing — so the tier looks blocked rather than broken.
    - name: Install iptables-persistent so the redirect survives reboot
      apt:
        name: iptables-persistent
        state: present
        update_cache: true
      # Pre-seed the debconf prompts; the package otherwise blocks asking whether to save rules.
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: DNAT udp/53 → udp/5300
      iptables:
        table: nat
        chain: PREROUTING
        protocol: udp
        destination_port: "53"
        jump: REDIRECT
        to_ports: "5300"
        comment: spark-dns 53->5300
      notify: Save iptables rules

    - name: systemd unit
      template:
        src: templates/spark-dns.service.j2
        dest: /etc/systemd/system/spark-dns.service
      notify: Restart spark-dns

    - name: Enable and start spark-dns
      systemd:
        name: spark-dns
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart spark-dns
      systemd:
        name: spark-dns
        state: restarted

    - name: Save iptables rules
      community.general.iptables_state:
        state: saved
        path: /etc/iptables/rules.v4
      # `iptables_state` needs the collection; fall back to the command the package ships with.
      failed_when: false
      register: _saved

    - name: Save iptables rules (fallback)
      shell: iptables-save > /etc/iptables/rules.v4
      when: _saved is failed or _saved is skipped
      changed_when: true
