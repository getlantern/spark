[package]
name = "dns-tunnel-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authoritative-side server for spark's DNS-tunnel transport (ADR 0011): UDP tunnel endpoint + real TCP egress + session store."

[[bin]]
name = "dns-tunnel-server"
path = "src/main.rs"

[lib]
name = "dns_tunnel_server"
path = "src/lib.rs"

[dependencies]
# The shared, no-I/O protocol core (framing, ARQ, DNS codec, crypto, session state machine).
dns-tunnel-core = { path = "../dns-tunnel-core" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# Telemetry export (issue #165), behind the off-by-default `otlp` feature — see [features].
serde_json = { workspace = true, optional = true }
boring2 = { workspace = true, optional = true }
tokio-boring2 = { workspace = true, optional = true }
webpki-root-certs = { workspace = true, optional = true }

[features]
# OTLP metrics export. **Off by default** because it pulls BoringSSL, and docs/GOAL.md makes a
# C-free base build a non-negotiable: documented C deps are "strictly off-by-default, feature-gated".
# This is the same treatment `core` gives boring under `anytls` (ADR 0001).
#
# Only the *exporter* is gated. `metrics.rs` is pure std and always compiles, so the counters and the
# instrumentation in `serve()` are present in every build — a default build tallies them and simply
# has nowhere to send them. That split keeps the feature flag off the tunnel's data path entirely:
# enabling or disabling telemetry cannot change how the server relays traffic.
otlp = ["dep:serde_json", "dep:boring2", "dep:tokio-boring2", "dep:webpki-root-certs"]
