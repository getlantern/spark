# XcodeGen spec for the spark macOS app + Packet Tunnel Provider SYSTEM EXTENSION.
# Generate: xcodegen generate (from platforms/apple/). Build the xcframework first
# (./build-xcframework.sh). The .xcodeproj is generated output (gitignored).
#
# Signing mirrors getlantern/lantern's working setup: MANUAL signing with the Developer ID
# Application identity + portal-created Developer-ID provisioning profiles (the
# `packet-tunnel-provider-systemextension` entitlement is distribution-only, so automatic
# *development* signing can't carry it). Create the two profiles (see README.md "live-gate
# handoff"), then their names go in PROVISIONING_PROFILE_SPECIFIER below.
name: Spark
options:
  bundleIdPrefix: org.getlantern.spark
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Manual Developer-ID signing for macOS (lantern's model).
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ACZRKC3LQ9
    "DEVELOPMENT_TEAM[sdk=macosx*]": ACZRKC3LQ9
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"

targets:
  SparkApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SparkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.getlantern.spark
        CODE_SIGN_ENTITLEMENTS: xcode/SparkApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Lantern"
        # Portal-created Developer-ID profile for org.getlantern.spark (NE + system-extension.install).
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "Spark macOS App"
    dependencies:
      - target: SparkTunnel
        embed: true

  SparkTunnel:
    # System extension (Developer-ID + notarized path), not an app-extension — required for a
    # non-App-Store macOS packet tunnel. A standalone executable: Sources/SparkTunnelMain/main.swift
    # calls NEProvider.startSystemExtensionMode().
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/SparkNE
      - path: Sources/SparkTunnelMain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.getlantern.spark.tunnel
        # A system extension bundle MUST be named <CFBundleIdentifier>.systemextension (sysextd
        # resolves the requested identifier to that exact filename — a mismatched name fails with
        # OSSystemExtensionErrorExtensionNotFound/code 4 even though the bundle is present). So the
        # product (bundle + executable) is named by the bundle id, mirroring lantern's PacketTunnel.
        PRODUCT_NAME: org.getlantern.spark.tunnel
        CODE_SIGN_ENTITLEMENTS: xcode/SparkTunnel.entitlements
        INFOPLIST_FILE: xcode/Extension-Info.plist
        # Portal-created Developer-ID profile for org.getlantern.spark.tunnel
        # (packet-tunnel-provider-systemextension + system-extension.install + app group).
        "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "Spark macOS Tunnel"
    dependencies:
      # The Rust core as a static-lib xcframework: link it into the extension, don't embed.
      - framework: SparkCore.xcframework
        embed: false
        link: true
