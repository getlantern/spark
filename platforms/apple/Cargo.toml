[package]
name = "spark-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Apple C-ABI static library, linked into the NetworkExtension Packet Tunnel Provider
# (iOS + macOS) and packaged as an .xcframework. NE extensions statically link, so `staticlib`.
# On non-Apple targets the FFI is cfg-d out → an empty staticlib, so it stays in the workspace's
# green-checked set without affecting other platforms.
[lib]
name = "spark_apple"
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
# AnyTLS transport (ADR 0001): enable spark-core's `anytls` so the NE provider can run an AnyTLS
# config. Built for the macOS slice (boring builds for the host arch); the iOS slices stay off
# (BoringSSL-for-iOS is a separate concern), so an AnyTLS config on iOS returns -1 until then.
anytls = ["spark-core/anytls"]
# Latency-selecting multi-server pool (docs/multi-server-selection-design.md): enable spark-core's
# `multi-server` so the NE provider can run a `[[transport.servers]]` pool (probe + rank + failover).
# boring-free (flint-dial happy-eyeballs), enabled on the macOS slice alongside anytls.
multi-server = ["spark-core/multi-server"]
# Self-fetch config from the Lantern config-new API (docs/config-new-fetch-design.md): enable
# spark-core's `config-fetch` so the NE provider can run `lantern-api` mode. Pulls `anytls` (BoringSSL)
# + `multi-server`, so it's the macOS/darwin slice only — like `anytls`.
config-fetch = ["spark-core/config-fetch"]
# Un-poisoned bootstrap DNS so hostname proxy servers in a fetched (or file) `config_raw.json` pool
# resolve before dialing; without it a hostname member is a hard error at connect. Darwin slice only
# (it pulls the boring connector). Benefits both `lantern-api` mode and the config_raw file path.
bootstrap-dns = ["spark-core/bootstrap-dns"]
# Transports the Lantern free-tier config-new pool actually uses. The config_raw adapter always maps
# these outbounds into the pool, so without the matching transport feature the tunnel hard-fails at
# build time ("transport.X is configured but spark was built without the `X` feature") on the first
# such server. Enabled on the darwin slice alongside `config-fetch` so a fetched prod pool runs.
samizdat = ["spark-core/samizdat"]
shadowsocks = ["spark-core/shadowsocks"]
hysteria2 = ["spark-core/hysteria2"]
# Domain-fronted meek polling transport — another outbound a fetched pool may carry. Pulls
# flint-fronted, which `config-fetch` already pulls, so this only adds the meek module code itself.
fronted-meek = ["spark-core/fronted-meek"]
# smart-routing + ad-block: fake-IP DNS, per-flow Direct/Proxy/Reject from the config's
# smart_routing/ad_block/route sections, and kindling-fetched .srs rule-sets. Inert unless the fetched
# config carries rules; the rule-set fetch + lantern-api path ride `config-fetch` (already on).
smart-routing = ["spark-core/smart-routing"]
# Dynamic-transport runtime (ADR 0013 §7): the wasmi host for signed byte-transform modules, plus
# `bip324` (which implies it) adding the secp256k1 host primitives + splitting egress, so the NE
# provider can run a signed bip324/obfs-xor module delivered by config — no app release. secp256k1
# cross-compiles for the iOS + macOS slices (verified), so this rides the darwin build alongside the
# transports above; `build-xcframework.sh` enables `bip324` for the shipped slices.
wasm-transport = ["spark-core/wasm-transport"]
bip324 = ["spark-core/bip324"]

# The shared shipping set (spark-core/prod) — what build-xcframework.sh builds every slice with.
# `system-stack` is deliberately absent: one feature list covers the iOS slices, which cannot hand
# over a tun fd in the shape it needs, and enabling it there would advertise a capability the
# platform cannot provide (`caps.system_stack`).
# Unbounded consumer (the censored side of the WebRTC peer-proxy). NOT in `prod`, because `prod` is one
# list shared by all three Apple slices and this is deliberately **macOS only** — the same reasoning as
# `system-stack`'s absence above. build-xcframework.sh appends it for the darwin slice alone:
#   - webrtc-rs has never been cross-built for aarch64-apple-ios here, and nothing in CI would catch it;
#   - the iOS NE runs on roughly a tenth of desktop's memory budget, and the consumer adds a QUIC
#     endpoint plus a WebRTC stack to a process that already holds the netstack.
unbounded = ["dep:spark-sharing", "spark-core/multi-server"]

prod = ["spark-core/prod"]

[dependencies]
spark-core = { path = "../../core" }
# The Unbounded consumer implementation (behind the `unbounded` feature, darwin slice only). A `path`
# dep across a workspace boundary — `spark-sharing` has its own workspace and lockfile.
spark-sharing = { path = "../../spark-sharing", features = ["spark-transport"], optional = true }
# This crate emits a few `tracing` events of its own (notably the refusal to start without a supplied
# identity); the NE's log bridge forwards them to os_log alongside core's.
tracing.workspace = true
