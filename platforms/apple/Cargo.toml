[package]
name = "spark-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Apple C-ABI static library, linked into the NetworkExtension Packet Tunnel Provider
# (iOS + macOS) and packaged as an .xcframework. NE extensions statically link, so `staticlib`.
# On non-Apple targets the FFI is cfg-d out → an empty staticlib, so it stays in the workspace's
# green-checked set without affecting other platforms.
[lib]
name = "spark_apple"
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
# AnyTLS transport (ADR 0001): enable spark-core's `anytls` so the NE provider can run an AnyTLS
# config. Built for the macOS slice (boring builds for the host arch); the iOS slices stay off
# (BoringSSL-for-iOS is a separate concern), so an AnyTLS config on iOS returns -1 until then.
anytls = ["spark-core/anytls"]
# Latency-selecting multi-server pool (docs/multi-server-selection-design.md): enable spark-core's
# `multi-server` so the NE provider can run a `[[transport.servers]]` pool (probe + rank + failover).
# boring-free (flint-dial happy-eyeballs), enabled on the macOS slice alongside anytls.
multi-server = ["spark-core/multi-server"]
# Self-fetch config from the Lantern config-new API (docs/config-new-fetch-design.md): enable
# spark-core's `config-fetch` so the NE provider can run `lantern-api` mode. Pulls `anytls` (BoringSSL)
# + `multi-server`, so it's the macOS/darwin slice only — like `anytls`.
config-fetch = ["spark-core/config-fetch"]
# Un-poisoned bootstrap DNS so hostname proxy servers in a fetched (or file) `config_raw.json` pool
# resolve before dialing; without it a hostname member is a hard error at connect. Darwin slice only
# (it pulls the boring connector). Benefits both `lantern-api` mode and the config_raw file path.
bootstrap-dns = ["spark-core/bootstrap-dns"]
# Transports the Lantern free-tier config-new pool actually uses. The config_raw adapter always maps
# these outbounds into the pool, so without the matching transport feature the tunnel hard-fails at
# build time ("transport.X is configured but spark was built without the `X` feature") on the first
# such server. Enabled on the darwin slice alongside `config-fetch` so a fetched prod pool runs.
samizdat = ["spark-core/samizdat"]
shadowsocks = ["spark-core/shadowsocks"]
hysteria2 = ["spark-core/hysteria2"]
# Domain-fronted meek polling (Shir-o-Khorshid CDN-fronting): a self-bootstrapping data-plane transport
# the config-new pool can assign, and whose vantage-point scanner also augments the cold-start config
# fetch. Pulls boring (like config-fetch); enabled on every Apple slice alongside it.
fronted-meek = ["spark-core/fronted-meek"]

[dependencies]
spark-core = { path = "../../core" }
