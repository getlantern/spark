plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.getlantern.spark'
    compileSdk 35

    defaultConfig {
        applicationId 'org.getlantern.spark'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Match the ABIs cargo-ndk builds into src/main/jniLibs.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            // libspark_android.so is built into src/main/jniLibs by the cargoNdkBuild task below
            // (wired to preBuild), so a clean build produces it with no manual step.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

// Build the Rust JNI lib (libspark_android.so) into src/main/jniLibs via cargo-ndk so a clean
// build produces the native lib with no manual step. Requires cargo-ndk + the Android NDK.
def rustCrateDir = rootProject.projectDir.parentFile        // platforms/android (the spark-android crate)
def repoRootDir = rustCrateDir.parentFile.parentFile        // repo root (cargo workspace root)
def jniLibsDir = new File(projectDir, 'src/main/jniLibs')
def ndkVersionForCargo = '28.2.13676358'

tasks.register('cargoNdkBuild', Exec) {
    group = 'build'
    description = 'Cross-compiles libspark_android.so for arm64-v8a + x86_64 via cargo-ndk.'
    workingDir rustCrateDir
    environment 'ANDROID_NDK_HOME',
        System.getenv('ANDROID_NDK_HOME') ?: "${android.sdkDirectory}/ndk/${ndkVersionForCargo}"
    commandLine 'cargo', 'ndk',
        '-t', 'arm64-v8a', '-t', 'x86_64', '-P', '24',
        '-o', jniLibsDir.absolutePath,
        'build', '--release', '-p', 'spark-android'
    // Up-to-date check: re-run only when the Android crate or the core sources change (so plain
    // Kotlin/UI edits don't shell out to cargo).
    inputs.dir new File(rustCrateDir, 'src')
    inputs.file new File(rustCrateDir, 'Cargo.toml')
    inputs.dir new File(repoRootDir, 'core/src')
    outputs.dir jniLibsDir
    doFirst {
        def hasCargoNdk = ['bash', '-lc', 'command -v cargo-ndk'].execute().waitFor() == 0
        if (!hasCargoNdk) {
            throw new GradleException('cargo-ndk not found. Run `cargo install cargo-ndk` and ensure ' +
                '~/.cargo/bin is on PATH (or build the .so manually per platforms/android/README.md).')
        }
    }
    doLast {
        // Drop cargo-ndk's stray copy of tun-rs's dylib byproduct (we statically link it into our .so).
        ['arm64-v8a', 'x86_64'].each { abi ->
            fileTree(dir: new File(jniLibsDir, abi), include: 'libtun_rs-*.so').each { it.delete() }
        }
    }
}

// Produce the .so before AGP reads/merges src/main/jniLibs.
tasks.named('preBuild').configure { dependsOn 'cargoNdkBuild' }

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json in unit tests: the bundled android.jar stub throws "not mocked",
    // so pull in the actual impl to exercise parseServers() against real JSON.
    testImplementation 'org.json:json:20240303'
}
