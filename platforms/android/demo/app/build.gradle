plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.getlantern.spark'
    compileSdk 35

    defaultConfig {
        applicationId 'org.getlantern.spark'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Match the ABIs cargo-ndk builds into src/main/jniLibs.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            // libspark_android.so is built into src/main/jniLibs by the cargoNdkBuild task below
            // (wired to preBuild), so a clean build produces it with no manual step.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

// Build the Rust JNI lib (libspark_android.so) into src/main/jniLibs via cargo-ndk so a clean
// build produces the native lib with no manual step. Requires cargo-ndk + the Android NDK.
def rustCrateDir = rootProject.projectDir.parentFile        // platforms/android (the spark-android crate)
def repoRootDir = rustCrateDir.parentFile.parentFile        // repo root (cargo workspace root)
def jniLibsDir = new File(projectDir, 'src/main/jniLibs')
def ndkVersionForCargo = '28.2.13676358'
def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: "${android.sdkDirectory}/ndk/${ndkVersionForCargo}"

tasks.register('cargoNdkBuild', Exec) {
    group = 'build'
    description = 'Cross-compiles libspark_android.so for arm64-v8a + x86_64 via cargo-ndk.'
    workingDir rustCrateDir
    environment 'ANDROID_NDK_HOME', ndkHome
    // -P is cargo-ndk's --platform (Android API level); derive it from minSdk so the two can't drift.
    commandLine 'cargo', 'ndk',
        '-t', 'arm64-v8a', '-t', 'x86_64', '-P', "${android.defaultConfig.minSdk}",
        '-o', jniLibsDir.absolutePath,
        // --locked: don't mutate Cargo.lock (which we declare as an input) — reproducible builds.
        'build', '--release', '--locked', '-p', 'spark-android'
    // Up-to-date check: re-run only when the Android crate, the core sources/manifest, or the
    // resolved dependency set (Cargo.lock) change — so plain Kotlin/UI edits don't shell out to
    // cargo, but a core feature-flag or dependency bump does.
    inputs.dir new File(rustCrateDir, 'src')
    inputs.file new File(rustCrateDir, 'Cargo.toml')
    inputs.dir new File(repoRootDir, 'core/src')
    inputs.file new File(repoRootDir, 'core/Cargo.toml')
    inputs.file new File(repoRootDir, 'Cargo.lock')
    outputs.dir jniLibsDir
    doFirst {
        // Fail fast with a clear message for the common missing-NDK case. cargo-ndk's own absence
        // surfaces a clear "no such command: ndk" from cargo, so we don't second-guess PATH here
        // (see platforms/android/README.md for the `cargo install cargo-ndk` prerequisite).
        if (!new File(ndkHome).isDirectory()) {
            throw new GradleException("Android NDK not found at '${ndkHome}'. Install NDK " +
                "${ndkVersionForCargo} (sdkmanager \"ndk;${ndkVersionForCargo}\") or set ANDROID_NDK_HOME.")
        }
    }
    doLast {
        // Drop cargo-ndk's stray copy of tun-rs's dylib byproduct (we statically link it into our .so).
        ['arm64-v8a', 'x86_64'].each { abi ->
            fileTree(dir: new File(jniLibsDir, abi), include: 'libtun_rs-*.so').each { it.delete() }
        }
    }
}

// Produce the .so before AGP reads/merges src/main/jniLibs.
tasks.named('preBuild').configure { dependsOn 'cargoNdkBuild' }

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json in unit tests: the bundled android.jar stub throws "not mocked",
    // so pull in the actual impl to exercise parseServers() against real JSON.
    testImplementation 'org.json:json:20240303'
}
