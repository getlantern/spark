plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.getlantern.spark'
    compileSdk 35

    defaultConfig {
        applicationId 'org.getlantern.spark'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Match the ABIs cargo-ndk builds into src/main/jniLibs.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            // The .so in src/main/jniLibs is already release-built by cargo-ndk; nothing to do.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json in unit tests: the bundled android.jar stub throws "not mocked",
    // so pull in the actual impl to exercise parseServers() against real JSON.
    testImplementation 'org.json:json:20240303'
}
