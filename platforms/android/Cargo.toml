[package]
name = "spark-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Android JNI library: a cdylib (`libspark_android.so`) loaded by the VpnService via
# System.loadLibrary("spark_android"). Built with cargo-ndk; on non-Android targets it compiles
# to an empty cdylib (the JNI symbols are cfg(target_os = "android")), so it stays in the
# workspace's green-checked set without affecting desktop builds.
[lib]
name = "spark_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Dynamic-transport runtime (ADR 0013 §7). Opt-in, NOT in the baked Android feature set below: a
# *release* build with `wasm-transport` refuses the dev module-signing key (fail-closed), so build with
# these only when a production module-signing pubkey is pinned via SPARK_MODULE_PUBKEY_HEX. Pass
# `--features bip324` from the cargoNdkBuild features config to ship a signed bip324/obfs-xor module
# (secp256k1 cross-compiles for Android via cargo-ndk).
wasm-transport = ["spark-core/wasm-transport"]
bip324 = ["spark-core/bip324"]

[dependencies]
spark-core = { path = "../../core" }

# Android-only deps. `tracing`/`tracing-subscriber` route the core's events to logcat (otherwise they
# vanish — an Android app's stdout isn't logcat); `__android_log_write` is in the NDK's liblog.
#
# spark-core features (Android slice). `system-stack`: Android's VpnService hands us a Linux tun fd, so
# the kernel-TCP redirect stack works there (sing-box ships `stack: system` on Android the same way).
# `config-fetch` + the transports (`anytls`/`multi-server`/`bootstrap-dns`/`samizdat`/`shadowsocks`/
# `hysteria2`): the daemon-owned `lantern-api` self-fetch + the transports a fetched config-new pool
# uses — the SAME set the macOS/iOS slices carry (BoringSSL cross-compiles for android, verified
# 2026-06-23). Baked in here rather than passed per-build, mirroring the Apple build-xcframework.sh
# slice. Target-gated so non-Android workspace builds stay boring/cmake-free.
#
# `jni`: the shim now passes a config string + data-dir path across JNI (for `run_fd_dispatch`), which
# needs JNI env calls — so the bridge is no longer primitive-only. Android-target-only, so it never
# touches the desktop/Apple/core builds.
[target.'cfg(target_os = "android")'.dependencies]
spark-core = { path = "../../core", features = [
    "system-stack",
    "config-fetch",
    "anytls",
    "multi-server",
    "bootstrap-dns",
    "samizdat",
    "shadowsocks",
    "hysteria2",
    "fronted-meek",
    # smart-routing + ad-block: fake-IP DNS, per-flow Direct/Proxy/Reject from the config's
    # smart_routing/ad_block/route sections, and kindling-fetched .srs rule-sets. Inert unless the
    # fetched config carries rules; needs config-fetch (above) for the rule-set fetch + lantern-api path.
    "smart-routing",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
jni = "0.21"
