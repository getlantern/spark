[package]
name = "spark-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Android JNI library: a cdylib (`libspark_android.so`) loaded by the VpnService via
# System.loadLibrary("spark_android"). Built with cargo-ndk; on non-Android targets it compiles
# to an empty cdylib (the JNI symbols are cfg(target_os = "android")), so it stays in the
# workspace's green-checked set without affecting desktop builds.
[lib]
name = "spark_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
spark-core = { path = "../../core" }

# Android-only: route the core's `tracing` events to logcat (otherwise they vanish — an Android
# app's stdout isn't logcat). `__android_log_write` is in the NDK's liblog.
[target.'cfg(target_os = "android")'.dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
