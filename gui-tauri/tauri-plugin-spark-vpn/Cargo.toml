[workspace]

[package]
name = "tauri-plugin-spark-vpn"
version = "0.1.0"
edition = "2021"
description = "Spark VPN control plugin (cross-platform tunnel control for the Tauri UI)"
links = "tauri-plugin-spark-vpn"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# macOS: the plugin's AppleControl talks to the NE via objc2 (ne_spike moves here in a later task).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSData"] }
objc2-network-extension = { version = "0.3", features = ["block2"] }
objc2-system-extensions = { version = "0.3", features = ["dispatch2"] }
dispatch2 = "0.3"

# Android: JNI to the in-process tunnel core (wired in a later task).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
