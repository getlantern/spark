[workspace]

[package]
name = "tauri-plugin-spark-vpn"
version = "0.1.0"
edition = "2021"
description = "Spark VPN control plugin (cross-platform tunnel control for the Tauri UI)"
links = "tauri-plugin-spark-vpn"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Parse the resolved config.toml dev override for the static server list (servers_from_config).
# Used only on the Apple targets — macOS + iOS (cfg-gated in desktop.rs) — but listed as a
# non-platform dep to avoid a conditional dep block; a compile-only dependency with no runtime cost
# on other targets.
toml = "0.8"

# Windows/Linux desktop: talk to the privileged spark-service over spark-ipc (W3). Gated off
# android (which uses the JNI core). macOS is included so the transport-agnostic ipc client +
# status mapping compile and unit-test on the dev host (its unix-socket path == the Linux path).
[target.'cfg(not(target_os = "android"))'.dependencies]
spark-ipc = { path = "../../ipc", features = ["stream"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }
# Fetch-only use of spark-core: run the same kindling config fetch the tunnel uses, in the app
# process, so the location list refreshes on every launch independent of the VPN (Phase 2a).
# `config-fetch` pulls BoringSSL (~8 MB) + flint fronting — the cost of reusing the censorship-
# resistant fetch (Phase 2a spike, docs/superpowers/specs/2026-07-10-locations-before-vpn-design.md).
# Desktop only; Android fetches in the :vpn process over IPC (Phase 2b).
spark-core = { path = "../../core", features = ["config-fetch"] }
# Diagnostics host (diag_host.rs): installs core's DiagLayer into the tracing registry.
# Minimal features, matching core's own dep (registry + std — no fmt/env-filter output;
# the layer only captures into the diag sink).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
# tracing macros: error-level events ride DiagLayer's §C2a fast path (e.g. the
# unbounded total_helped persist failure). Version matches core's dep.
tracing = "0.1"

# Unbounded (volunteer-proxy) peer-sharing pool + aggregation. Its own workspace (excluded from the
# root workspace) with a git dep on lantern-unbounded, so it's pulled in by `path` here. The
# `unbounded` module folds its PoolEvent stream into the `spark://unbounded` UI event.
#
# DESKTOP ONLY — matches the `unbounded` module's `cfg(desktop)`. Excluding mobile is both a product
# decision (a phone in an uncensored region should not relay strangers' traffic: battery, data plan,
# NAT, and the legal exposure of being the visible source) and a build one: otherwise iOS/Android
# resolve and compile the whole WebRTC/QUIC stack (lantern-unbounded, quinn, rustls, rcgen) they can
# never reach — dead weight at best, a toolchain failure at worst, and no CI job builds either target
# to catch it. Being a censored *consumer* of Unbounded is a separate concern, behind spark-sharing's
# `spark-transport` feature, and is unaffected by this gate.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
spark-sharing = { path = "../../spark-sharing" }

# Apple (macOS + iOS): AppleControl drives the NE via objc2 (NETunnelProviderManager). Shared by
# both Apple targets — iOS reuses the same control path, minus the system-extension activation.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "block2",
    "NSData",
    "NSString",
    "NSDictionary",
] }
objc2-network-extension = { version = "0.3", features = ["block2"] }
dispatch2 = "0.3"

# macOS-only: system-extension activation (no system extensions on iOS) and the AppKit icon
# renderer used by the macOS app-based split-tunnel picker (apps_darwin, macOS-only).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-system-extensions = { version = "0.3", features = ["dispatch2"] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
] }

# Windows: named-pipe transient-error codes (ERROR_FILE_NOT_FOUND / ERROR_PIPE_BUSY) for the
# ServiceControl connect retry. Version matches the rest of the tree.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

# Android: JNI to the in-process tunnel core (wired in a later task).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
