[workspace]

[package]
name = "tauri-plugin-spark-vpn"
version = "0.1.0"
edition = "2021"
description = "Spark VPN control plugin (cross-platform tunnel control for the Tauri UI)"
links = "tauri-plugin-spark-vpn"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Parse the resolved config.toml dev override for the static server list (servers_from_config).
# Used only on macOS (cfg-gated in desktop.rs) but listed as a non-platform dep to avoid
# a conditional dep block; it's a compile-only dependency with no runtime cost on other targets.
toml = "0.8"

# macOS: the plugin's AppleControl talks to the NE via objc2 (ne_spike moves here in a later task).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSData", "NSString"] }
objc2-network-extension = { version = "0.3", features = ["block2"] }
objc2-system-extensions = { version = "0.3", features = ["dispatch2"] }
dispatch2 = "0.3"
# Icons: NSWorkspace renders the true Finder icon for every app — including asset-catalog system
# apps (Calendar) and stub-`.icns` apps (Books) that `sips` alone can't read. We take its TIFF
# (NSImage) and let `sips` downscale to PNG. Already compiled in via tauri/muda/wry, so this
# direct declaration adds no new external surface — same objc2 family already used above.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage"] }

# Android: JNI to the in-process tunnel core (wired in a later task).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
