[package]
name = "gui-tauri"
version = "0.1.0"
description = "Spark — Lantern desktop client (Tauri UI)"
authors = ["Lantern <support@getlantern.org>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The app crate is a UI shell: it only spins up the Tauri builder and registers
# plugins. All VPN control (and its macOS NetworkExtension objc2 bridge, serde
# models, and config parsing) now lives in `tauri-plugin-spark-vpn`, so those
# dependencies moved there too.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-spark-vpn = { path = "../tauri-plugin-spark-vpn" }

