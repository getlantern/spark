[package]
name = "gui-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# U1a spike: reach macOS NetworkExtension from Rust directly via objc2 (no Swift
# toolchain). Proves the Tauri-desktop → NETunnelProviderManager bridge for NE
# Model A. macOS-only so the other targets don't pull these in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# Foundation classes (NSArray/NSDate/NSRunLoop/NSError) are on by default; `block2`
# enables the completion-handler-taking methods.
objc2-foundation = { version = "0.3", features = ["block2"] }
# All NE classes are available by default in 0.3.x (no per-class features); `block2`
# enables loadAllFromPreferencesWithCompletionHandler (the async read U1b uses).
objc2-network-extension = { version = "0.3", features = ["block2"] }
# U1b-2b-ii: activate the embedded packet-tunnel system extension on first connect
# (OSSystemExtensionRequest). The queue-based activation constructor is gated behind
# the `dispatch2` feature; we pass the main dispatch queue from `dispatch2`.
objc2-system-extensions = { version = "0.3", features = ["dispatch2"] }
dispatch2 = "0.3"

