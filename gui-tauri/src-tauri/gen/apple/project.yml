name: gui-tauri
options:
  bundleIdPrefix: org.getlantern.spark
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settings:
  base:
    # Automatic signing can provision the iOS packet-tunnel-provider entitlement for a paid account
    # (unlike macOS Developer-ID). Applies to both the app and the NE app-extension target.
    DEVELOPMENT_TEAM: ACZRKC3LQ9
    CODE_SIGN_STYLE: Automatic
settingGroups:
  app:
    base:
      PRODUCT_NAME: Spark
      PRODUCT_BUNDLE_IDENTIFIER: org.getlantern.spark
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  gui-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Referenced only so the folder shows in the project tree + the preBuildScript can emit
      # libapp.a here. `buildPhase: none` keeps xcodegen from bucketing the static libapp.a into
      # the Resources copy phase (it's already LINKED via the `framework: libapp.a` dependency
      # below; a .a is a build-time link input, never a runtime bundle resource). Without this,
      # the app ships a redundant copy of libapp.a in Resources/ (bundle bloat / App Store nit).
      - path: Externals
        buildPhase: none
      - path: gui-tauri_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: gui-tauri_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: gui-tauri_iOS/gui-tauri_iOS.entitlements
      properties:
        # App-Store `packet-tunnel-provider` flavor (NOT the macOS `-systemextension`); shares the
        # provider config + self-fetch cache with the NE via the App Group.
        "com.apple.developer.networking.networkextension":
          - packet-tunnel-provider
        "com.apple.security.application-groups":
          - group.org.getlantern.spark
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Embed the Packet Tunnel Provider app-extension into the app bundle's PlugIns/.
      - target: SparkTunnel
        embed: true
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  SparkTunnel:
    # iOS Packet Tunnel Provider — an APP-EXTENSION (not a macOS system-extension). Reuses the same
    # shared PacketTunnelProvider.swift / FdResolver.swift as macOS (referenced from platforms/apple),
    # linking the Rust core via SparkCore.xcframework (iOS slice). No main.swift: the NSExtension
    # principal class in Info.plist is the entry point.
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../../platforms/apple/Sources/SparkNE
    info:
      path: SparkTunnel/Info.plist
      properties:
        CFBundleDisplayName: Spark Tunnel
        # Must match the containing app's version (0.1.0) — App Store rejects a mismatch, and Xcode
        # warns on it. Keep in sync with the gui-tauri_iOS app target's CFBundle*Version.
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # iOS NE app-extensions declare an NSExtension dict (vs the macOS system-extension's
        # NetworkExtension dict + NEMachServiceName). The principal class is the entry point.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: SparkTunnel/SparkTunnel.entitlements
      properties:
        "com.apple.developer.networking.networkextension":
          - packet-tunnel-provider
        "com.apple.security.application-groups":
          - group.org.getlantern.spark
    settings:
      base:
        PRODUCT_NAME: SparkTunnel
        PRODUCT_BUNDLE_IDENTIFIER: org.getlantern.spark.tunnel
        ENABLE_BITCODE: false
        ARCHS: [arm64]
    dependencies:
      # Link (don't embed) the Rust core static-lib xcframework — provides the `SparkCore` module.
      - framework: ../../../../platforms/apple/SparkCore.xcframework
        embed: false
        link: true