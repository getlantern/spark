<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover populates env(safe-area-inset-*) on notched/edge-to-edge devices
         (Android 15 draws behind the status bar + camera cutout by default; iOS notch). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spark</title>
    <!-- Zero-flash appearance: an EXTERNAL (from 'self') render-blocking script sets data-theme
         before first paint. External, not inline, to satisfy the Tauri CSP (`script-src 'self'`,
         no 'unsafe-inline'). See static/theme-init.js. -->
    <script src="%sveltekit.assets%/theme-init.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
