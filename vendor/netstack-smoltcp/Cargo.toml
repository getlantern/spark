# Vendored fork of `netstack-smoltcp`, pinned to upstream 0.2.2.
#
# This crate parses untrusted packets straight off the TUN, so it is part of our
# attack surface and is audited in-tree rather than pulled from crates.io. It is
# depended on by `path` from `core/` (see the workspace manifest) and is excluded
# from the workspace members so its examples/tests/dev-deps are not built here.
#
# `smoltcp` is pinned to an exact version on purpose: we control netstack-backend
# bumps ourselves rather than letting a caret range float them.
[package]
name = "netstack-smoltcp"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
description = "A netstack that turns TUN IP packets into TCP streams and UDP packets, backed by smoltcp."
license = "MIT OR Apache-2.0"
repository = "https://github.com/automesh-network/netstack-smoltcp"

[lib]
name = "netstack_smoltcp"
path = "src/lib.rs"

[dependencies]
etherparse = "0.16"
futures = "0.3"
rand = "0.8"
spin = "0.9"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dependencies.smoltcp]
version = "=0.12.0"
default-features = false
features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
]
