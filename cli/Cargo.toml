[package]
name = "spark-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "spark"
path = "src/main.rs"

[dependencies]
spark-core = { path = "../core" }
spark-ipc = { path = "../ipc", features = ["stream"] }
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
bytes.workspace = true

[features]
anytls = ["spark-core/anytls"]
# Shadowsocks 2022 (ADR 0009). Forwarded so a release build can carry the same transport set the
# Apple and Android slices already bake in — without this the feature is unreachable from the binary
# and a shadowsocks outbound hard-fails at build-transport time.
shadowsocks = ["spark-core/shadowsocks"]
system-stack = ["spark-core/system-stack"]
bootstrap-dns = ["spark-core/bootstrap-dns"]
multi-server = ["spark-core/multi-server"]
fronted-meek = ["spark-core/fronted-meek"]
# Dynamic-transport runtime (ADR 0013 §7): the wasmi host for signed byte-transform modules, and
# `bip324` (which implies it) adding the secp256k1 host primitives + splitting egress. Off by default
# (bip324 pulls the C-backed secp256k1); enable to run a signed bip324/obfs-xor module.
wasm-transport = ["spark-core/wasm-transport"]
bip324 = ["spark-core/bip324"]
# Samizdat (ADR 0007), Hysteria 2 (ADR 0010) and the DNS tunnel (ADR 0011): transports a fetched
# config-new pool can name. Without the matching feature a pool entry naming one is a hard error at
# transport-build time, by design — spark refuses rather than silently degrading.
samizdat = ["spark-core/samizdat"]
hysteria2 = ["spark-core/hysteria2"]
dns-tunnel = ["spark-core/dns-tunnel"]
# Proxyless (ADR 0014): reach destinations with no exit hop, via an un-poisoned resolver plus opening
# shaping. Enabling the feature only makes it *available*; a config still has to ask for it.
proxyless = ["spark-core/proxyless"]
# Self-fetch the config from the Lantern config-new API. Pulls anytls + multi-server.
config-fetch = ["spark-core/config-fetch"]
# Fake-IP DNS + per-flow Direct/Proxy/Reject routing and ad-block rule-sets. Inert unless the fetched
# config carries rules.
smart-routing = ["spark-core/smart-routing"]

# Everything a production desktop build ships — the single source of truth for "what a real binary
# can do", so the release workflow cannot drift from the transports the Apple and Android slices
# already carry. That drift is exactly how `anytls` and `shadowsocks` went missing from desktop
# releases while working fine on phones.
#
# Deliberately NOT here:
#   - `bip324`: gated on a pinned module-signing key (a release build refuses the dev key), so the
#     workflow adds it only when SPARK_MODULE_PUBKEY_HEX is configured.
#   - `module-signer`: offline tooling that signs modules with a private key. It has no place in a
#     shipped binary.
prod = [
    # The shared set (spark-core/prod), plus the kernel-TCP stack: desktop owns the tun fd, so
    # `stack = system` is a real option here. Everything else lives in core/Cargo.toml so this list
    # cannot drift from what the phones ship.
    "spark-core/prod",
    "spark-core/system-stack",
]
