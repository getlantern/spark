[package]
name = "spark-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "spark_service"
path = "src/lib.rs"

[[bin]]
name = "spark-service"
path = "src/main.rs"

[features]
# AnyTLS transport (ADR 0001): enable spark-core's `anytls` so the service can run an AnyTLS profile.
# Off by default — the base service stays rustls/ring-only with no C/cmake BoringSSL build.
anytls = ["spark-core/anytls"]
# Shadowsocks 2022 (ADR 0009). Forwarded for the same reason as in spark-cli: the release build needs
# the transport set the mobile slices already carry, and the feature was previously unreachable here.
shadowsocks = ["spark-core/shadowsocks"]
bootstrap-dns = ["spark-core/bootstrap-dns"]
multi-server = ["spark-core/multi-server"]
# Dynamic-transport runtime (ADR 0013 §7): the wasmi host for signed byte-transform modules, and
# `bip324` (which implies it) adding the secp256k1 host primitives + splitting egress. Off by default
# (bip324 pulls the C-backed secp256k1); enable to run a signed bip324/obfs-xor module or the egress.
wasm-transport = ["spark-core/wasm-transport"]
bip324 = ["spark-core/bip324"]
# Samizdat (ADR 0007), Hysteria 2 (ADR 0010) and the DNS tunnel (ADR 0011): transports a fetched
# config-new pool can name. Without the matching feature a pool entry naming one is a hard error at
# transport-build time, by design — spark refuses rather than silently degrading.
samizdat = ["spark-core/samizdat"]
hysteria2 = ["spark-core/hysteria2"]
dns-tunnel = ["spark-core/dns-tunnel"]
# Proxyless (ADR 0014): reach destinations with no exit hop, via an un-poisoned resolver plus opening
# shaping. Enabling the feature only makes it *available*; a config still has to ask for it.
proxyless = ["spark-core/proxyless"]
# Self-fetch the config from the Lantern config-new API. Pulls anytls + multi-server.
config-fetch = ["spark-core/config-fetch"]
# Fake-IP DNS + per-flow Direct/Proxy/Reject routing and ad-block rule-sets. Inert unless the fetched
# config carries rules.
smart-routing = ["spark-core/smart-routing"]
# Kernel-TCP netstack (docs/system-stack-design.md) and domain-fronted meek polling — the service
# owns the tun fd on Linux/macOS, so both belong here as much as in the CLI.
system-stack = ["spark-core/system-stack"]
fronted-meek = ["spark-core/fronted-meek"]

# Everything a production desktop build ships — the single source of truth for "what a real binary
# can do", so the release workflow cannot drift from the transports the Apple and Android slices
# already carry. That drift is exactly how `anytls` and `shadowsocks` went missing from desktop
# releases while working fine on phones.
#
# Deliberately NOT here:
#   - `bip324`: gated on a pinned module-signing key (a release build refuses the dev key), so the
#     workflow adds it only when SPARK_MODULE_PUBKEY_HEX is configured.
#   - `module-signer`: offline tooling that signs modules with a private key. It has no place in a
#     shipped binary.
prod = [
    # The shared set (spark-core/prod), plus the kernel-TCP stack: desktop owns the tun fd, so
    # `stack = system` is a real option here. Everything else lives in core/Cargo.toml so this list
    # cannot drift from what the phones ship.
    "spark-core/prod",
    "spark-core/system-stack",
    # THIS crate's `config-fetch`, not just core's. `spark-core/prod` already turns core's on, so
    # this adds no code to core — what it adds is the `cfg(feature = "config-fetch")` that THIS
    # crate's source reads, which a `spark-core/…` entry does not set. `diag_wire`'s uploader is
    # behind exactly that cfg, so without this line a `--features prod` service silently ships the
    # capture half and no uploader, which is the bug this whole change exists to fix.
    "config-fetch",
]

[dependencies]
spark-ipc = { path = "../ipc", features = ["stream"] }
spark-core = { path = "../core" }
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
# Profile-store persistence (ADR 0004): serialize the named-`Config` store to a TOML file. Both are
# workspace-locked deps already used by `core` — reused here, not a new external dependency.
serde.workspace = true
toml.workspace = true

# Unix control transport: socket file ownership/perms (chown to the spark group), peer-cred
# supplementary-group resolution, and the test `getuid`/`getgid`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows control transport + service integration.
# - windows-sys: the named pipe's admin-only DACL (SECURITY_ATTRIBUTES from an SDDL string).
#   Already in the lockfile transitively (via tokio/socket2); used directly here.
# - windows-service: SCM integration (run spark-service as a proper Windows service). Type-safe
#   wrappers over StartServiceCtrlDispatcher/RegisterServiceCtrlHandlerEx/SetServiceStatus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
windows-service = "0.7"
