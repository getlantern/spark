# Anchor / JA4 drift control (ADR 0006 §4).
#
# Two guards on a weekly cadence (and on demand / on edits to the profile):
#  - profile-drift: deterministic — does *our* boring ClientHello still emit the pinned ANCHOR_JA4?
#    (This also runs on every push via the main CI's `--all-features` test job; here it gets a
#    schedule so dependency/toolchain drift is caught even without a code change.)
#  - chrome-oracle: best-effort — does *real, current* Chrome still emit our anchor's cipher profile?
#    Captures Chrome's JA4 from a TLS-fingerprint echo and compares the JA4_a+JA4_b prefix (the
#    version/SNI/counts + cipher hash — stable across Chrome point releases, moves on a real cipher
#    change). A mismatch means Chrome advanced past chrome-137 and the anchor should be refreshed.
name: Anchor drift

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/src/transport/ja4.rs"
      - "core/src/transport/anytls/anchor.rs"
      - "core/src/transport/anytls/tls.rs"
      - "core/src/transport/anytls/profile.rs"
      - ".github/workflows/anchor-drift.yml"

env:
  CARGO_TERM_COLOR: always
  # The JA4_a + JA4_b prefix of ANCHOR_JA4 (core/src/transport/anytls/anchor.rs): the TLS-version /
  # SNI / cipher+extension counts + the canonical Chrome cipher hash. Update alongside ANCHOR_JA4.
  EXPECTED_CHROME_PREFIX: "t13d1516h2_8daaf6152771"

jobs:
  profile-drift:
    name: profile vs anchor (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture our boring ClientHello and check its JA4 against the pinned anchor
        run: cargo test -p spark-core --features anytls -- transport::anytls::anchor transport::ja4

  chrome-oracle:
    name: live Chrome vs anchor (best-effort)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Capture real Chrome's JA4 and compare the cipher prefix
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          # A TLS-fingerprint echo: the response carries the JA4 of the connecting client (Chrome).
          ECHO_URL="https://tls.peet.ws/api/all"
          ja4=""
          for attempt in 1 2 3 4 5; do
            dom="$("$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
                    --dump-dom "$ECHO_URL" 2>/dev/null || true)"
            # Pull the JA4 out by its shape, independent of the JSON schema (t<ver><d|i><counts><alpn>_<12hex>_<12hex>).
            ja4="$(printf '%s' "$dom" | grep -oE 't[0-9a-z]{2}[di][0-9]{4}[a-z0-9]{2}_[0-9a-f]{12}_[0-9a-f]{12}' | head -1 || true)"
            [ -n "$ja4" ] && break
            echo "attempt $attempt: no JA4 yet, retrying…" >&2
            sleep 10
          done

          if [ -z "$ja4" ]; then
            echo "::warning title=Chrome oracle unreachable::could not capture a Chrome JA4 from $ECHO_URL after retries (external service, not a drift signal)"
            exit 1
          fi

          prefix="${ja4%_*}" # drop JA4_c (the volatile extension+sigalg hash); keep JA4_a_JA4_b
          echo "live Chrome JA4 : $ja4"
          echo "live prefix     : $prefix"
          echo "anchor prefix   : $EXPECTED_CHROME_PREFIX"
          if [ "$prefix" != "$EXPECTED_CHROME_PREFIX" ]; then
            echo "::error title=Chrome anchor drift::real Chrome now fingerprints as '$prefix' but the spark anchor expects '$EXPECTED_CHROME_PREFIX' — Chrome moved past chrome-137; refresh the boring profile + ANCHOR_JA4 (see docs/handshake-gambit-design.md §4)."
            exit 1
          fi
          echo "no drift: real Chrome still matches the chrome-137 anchor's cipher profile."
