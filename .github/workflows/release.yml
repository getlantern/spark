# Release: build the desktop binaries on their native runners, enforce the size budget, package each
# platform's artifact, and publish. Two paths through the same build:
#
#   v* tag        -> the real release: every package format, the notarized macOS DMG, a versioned
#                    GitHub Release.
#   push to main  -> a rolling `nightly` prerelease carrying just the binaries, so the latest main is
#                    always installable without waiting for a tag. Installer formats (.deb, .msi) and
#                    the notarized DMG are deliberately tag-only — their version fields carry ordering
#                    semantics a rolling build cannot state honestly (a Debian version must start with
#                    a digit, an MSI version must be numeric x.y.z, and an installer that always
#                    claims the same synthetic version breaks upgrade detection).
#
# Packaging definitions live under packaging/.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch: # manual dry run (versioned as main-<sha>)

permissions:
  contents: write # create the Release + upload assets

# One nightly at a time: two merges in quick succession would otherwise race to move the same tag,
# and the loser could publish older binaries over newer ones. Tag releases are never cancelled —
# interrupting a publish part-way through uploading assets is far worse than queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, os: unix }
          - { target: x86_64-apple-darwin, runner: macos-latest, os: unix }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, os: linux }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, os: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Derived once and reused by every packaging step below. Each step previously re-derived it
      # from `github.ref_name`, which only produces a sensible answer for a tag — on a branch it
      # would have named the artifacts after the branch.
      - name: Derive the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=main-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build release
        # `prod` is the canonical feature set, defined once in cli/Cargo.toml + service/Cargo.toml so
        # this workflow cannot drift from what a real binary is supposed to do. Naming individual
        # transports here is what let desktop ship without anytls/shadowsocks while the Apple and
        # Android slices carried them; a config naming a missing transport hard-fails at
        # transport-build time, by design.
        #
        # bip324 (ADR 0013 §7) is baked in on top when the module-signing PUBLIC key is configured
        # (vars.SPARK_MODULE_PUBKEY_HEX). Only the public key lives in CI — a release build with
        # wasm-transport pins it (and refuses the dev key); the private key + module signing stay
        # offline. Unset → no wasm runtime, smaller binaries.
        shell: bash
        env:
          SPARK_MODULE_PUBKEY_HEX: ${{ vars.SPARK_MODULE_PUBKEY_HEX }}
        run: |
          features=prod
          if [ -n "$SPARK_MODULE_PUBKEY_HEX" ]; then features="$features,bip324"; fi
          cargo build --release --target ${{ matrix.target }} \
            -p spark-cli -p spark-service --features "$features"

      # Untrusted-input hygiene: a ref name can contain shell metacharacters, so it reaches shells
      # only through the runner's own $GITHUB_REF_NAME (and the $VERSION derived from it above),
      # never interpolated into a script by the expression syntax.
      - name: Size budget
        if: matrix.os != 'windows'
        env:
          SPARK_MODULE_PUBKEY_HEX: ${{ vars.SPARK_MODULE_PUBKEY_HEX }}
        run: |
          # Budgets track the `prod` feature set the build above produces, sized for the *Linux* ELF —
          # the fattest thing we build, at a measured 30% over the macOS Mach-O (opt-level = 3).
          #
          # spark-service, largest of the pair:
          #   prod            8.24 MiB macOS  /  10.75 MiB Linux (both measured)  -> 12 MiB, 89%
          #   prod + bip324   9.90 MiB macOS  /  ~12.9 MiB Linux (projected)      -> 16 MiB, 80%
          #
          # The bip324 branch only builds when a module-signing key is configured, so its Linux size
          # has never been measured — hence the wider margin on a number that is still an estimate.
          if [ -n "$SPARK_MODULE_PUBKEY_HEX" ]; then budget=$((16 * 1024 * 1024)); else budget=$((12 * 1024 * 1024)); fi
          status=0
          for b in spark spark-service; do
            f="target/${{ matrix.target }}/release/$b"
            # Fail loudly if the build didn't produce the binary we mean to gate (don't let an empty
            # `sz` fall through to a spurious "ok").
            if [ ! -f "$f" ]; then echo "$b: MISSING ($f) — build did not produce it"; status=1; continue; fi
            sz=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
            pct=$((sz * 100 / budget))
            if [ "$sz" -gt "$budget" ]; then
              echo "$b: $sz bytes (${pct}% of budget) OVER BUDGET"; status=1
            else
              echo "$b: $sz bytes (${pct}% of budget) ok"
            fi
          done
          exit $status

      - name: Package tarball (macOS / Linux)
        if: matrix.os != 'windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ver="$VERSION"
          bindir="target/$TARGET/release"
          mkdir -p dist
          tarball="spark-$ver-$TARGET.tar.gz"
          tar -C "$bindir" -czf "dist/$tarball" spark spark-service
          ( cd dist && shasum -a 256 "$tarball" > "$tarball.sha256" )

      # Tag-only: a Debian version must start with a digit, which `main-<sha>` does not.
      - name: Package .deb (Linux)
        if: matrix.os == 'linux' && github.ref_type == 'tag'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          packaging/debian/build-deb.sh "$VERSION" amd64 "target/$TARGET/release" dist

      - name: Package zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ver = $env:VERSION
          $bindir = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item packaging/config.example.toml "$bindir/config.example.toml"
          $items = @("$bindir/spark.exe", "$bindir/spark-service.exe", "$bindir/config.example.toml")
          Compress-Archive -Path $items -DestinationPath "dist/spark-$ver-$env:TARGET.zip"

      # Tag-only: WiX requires a numeric x.y.z version, and Windows Installer uses it for upgrade
      # ordering — a nightly that always claimed the same synthetic version would break upgrades.
      - name: Build MSI (Windows)
        if: matrix.os == 'windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ver = $env:VERSION
          $bindir = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          # WiX v5 (uses the v4 schema). ServiceInstall is core, so no extension is needed.
          dotnet tool install --global wix
          wix build -arch x64 `
            -d "Version=$ver" `
            -d "BinDir=$bindir" `
            -d "ConfigSrc=packaging/config.example.toml" `
            -o "dist/spark-$ver-x64.msi" `
            packaging/windows/spark.wxs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.target }}
          path: dist/*

  # Notarized macOS app DMG (Model A — ADR 0005): the controlling app + embedded NE system extension,
  # built by packaging/macos/build-dmg.sh (the source-of-truth script). Gated behind a repo VARIABLE
  # so the rest of the release still works before the signing secrets are configured — set
  # `vars.MACOS_APP_PACKAGING = 'true'` once these repo SECRETS exist:
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD       base64 of the "Developer ID Application" .p12 + its password
  #   MACOS_PROFILE_APP / MACOS_PROFILE_TUNNEL   base64 of the "Spark macOS App" / "Spark macOS Tunnel" profiles
  #   AC_USERNAME / AC_PASSWORD                  Apple ID + app-specific password for notarytool (team ACZRKC3LQ9)
  package-macos-app:
    name: package macOS app (DMG)
    # Tag-only as well as gated on the signing vars: notarization is a slow round-trip to Apple, and
    # a rolling prerelease has no version for the app bundle to carry.
    if: ${{ vars.MACOS_APP_PACKAGING == 'true' && github.ref_type == 'tag' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen

      - name: Import Developer ID signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/spark-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the user search list so codesign/xcodebuild find the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install Developer ID provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.MACOS_PROFILE_APP }}
          PROFILE_TUNNEL: ${{ secrets.MACOS_PROFILE_TUNNEL }}
        run: |
          # Install to both the classic and modern (Xcode 16+) profile dirs; xcodebuild matches the
          # profile by the Name embedded inside (the filename is irrelevant).
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_APP"    | base64 --decode > "$dir/spark-macos-app.provisionprofile"
            echo "$PROFILE_TUNNEL" | base64 --decode > "$dir/spark-macos-tunnel.provisionprofile"
          done

      - name: Build + notarize the DMG
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          export VERSION="${REF_NAME#v}"
          packaging/macos/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-macos-app
          path: dist/*.dmg

  nightly:
    name: publish nightly prerelease
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Delete-and-recreate rather than edit-in-place. It is the only way to move the tag to this
      # commit, and it guarantees the release holds exactly what this build produced: an edit would
      # leave behind any asset a previous build uploaded that this one no longer makes. The brief gap
      # where no `nightly` exists is acceptable for a prerelease; a stale mixed set of binaries is not.
      - name: Move the nightly prerelease to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          gh release delete nightly --yes --cleanup-tag || true
          # Written to a file rather than passed inline: a commit subject is untrusted text, and the
          # angle brackets and ampersands are stripped so it cannot inject markup into the notes.
          {
          cat <<'MD'
          Automatic build of `main` — **not a stable release**.

          MD
          printf 'Commit: %s\n' "$GITHUB_SHA"
          printf 'Subject: %s\n\n' "$(printf '%s' "$subject" | tr -d '<>&')"
          cat <<'MD'
          Binaries only (`spark` + `spark-service`) for macOS arm64/x64, Linux x64 and Windows x64.
          Installer formats — `.deb`, `.msi` and the notarized macOS DMG — ship only on tagged
          releases, because their version fields carry upgrade-ordering semantics a rolling build
          cannot state honestly.
          MD
          } > notes.md
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "main @ $sha" \
            --notes-file notes.md

  publish:
    name: publish release
    # Wait for build (required) and the optional macOS app job. always() keeps publish running even
    # when package-macos-app is skipped (signing not configured); the explicit checks keep it correct.
    needs: [build, package-macos-app]
    if: ${{ always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
