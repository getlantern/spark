# Release: on a v* tag, build release binaries for the three desktop targets on their native
# runners, enforce the size budget, package each platform's artifact, and publish them to the
# GitHub Release. Packaging definitions live under packaging/.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual dry run (uses the branch name as the version)

permissions:
  contents: write # create the Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, os: unix }
          - { target: x86_64-apple-darwin, runner: macos-latest, os: unix }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, os: linux }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, os: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        # bip324 (ADR 0013 §7) is baked in when the module-signing PUBLIC key is configured
        # (vars.SPARK_MODULE_PUBKEY_HEX). Only the public key lives in CI — a release build with
        # wasm-transport pins it (and refuses the dev key); the private key + module signing stay
        # offline. Unset → the previous default (no wasm runtime, smaller binaries).
        shell: bash
        env:
          SPARK_MODULE_PUBKEY_HEX: ${{ vars.SPARK_MODULE_PUBKEY_HEX }}
        run: |
          if [ -n "$SPARK_MODULE_PUBKEY_HEX" ]; then
            cargo build --release --target ${{ matrix.target }} -p spark-cli -p spark-service --features bip324
          else
            cargo build --release --target ${{ matrix.target }} --bin spark --bin spark-service
          fi

      # Untrusted-input hygiene: the tag name reaches shells only via $REF_NAME, never inlined.
      - name: Size budget
        if: matrix.os != 'windows'
        env:
          SPARK_MODULE_PUBKEY_HEX: ${{ vars.SPARK_MODULE_PUBKEY_HEX }}
        run: |
          # Default binaries stay < 3 MiB. A bip324 build embeds wasmi + secp256k1 (~+2 MiB), so it gets
          # a 6 MiB budget (measured ~4.85 MiB on macOS + headroom); still catches gross bloat.
          if [ -n "$SPARK_MODULE_PUBKEY_HEX" ]; then budget=$((6 * 1024 * 1024)); else budget=$((3 * 1024 * 1024)); fi
          status=0
          for b in spark spark-service; do
            f="target/${{ matrix.target }}/release/$b"
            sz=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f")
            pct=$((sz * 100 / budget))
            if [ "$sz" -gt "$budget" ]; then
              echo "$b: $sz bytes (${pct}% of budget) OVER BUDGET"; status=1
            else
              echo "$b: $sz bytes (${pct}% of budget) ok"
            fi
          done
          exit $status

      - name: Package tarball (macOS / Linux)
        if: matrix.os != 'windows'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ver="${REF_NAME#v}"
          bindir="target/$TARGET/release"
          mkdir -p dist
          tarball="spark-$ver-$TARGET.tar.gz"
          tar -C "$bindir" -czf "dist/$tarball" spark spark-service
          ( cd dist && shasum -a 256 "$tarball" > "$tarball.sha256" )

      - name: Package .deb (Linux)
        if: matrix.os == 'linux'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ver="${REF_NAME#v}"
          packaging/debian/build-deb.sh "$ver" amd64 "target/$TARGET/release" dist

      - name: Package zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $ver = $env:REF_NAME -replace '^v',''
          $bindir = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item packaging/config.example.toml "$bindir/config.example.toml"
          $items = @("$bindir/spark.exe", "$bindir/spark-service.exe", "$bindir/config.example.toml")
          Compress-Archive -Path $items -DestinationPath "dist/spark-$ver-$env:TARGET.zip"

      - name: Build MSI (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $ver = $env:REF_NAME -replace '^v',''
          $bindir = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          # WiX v5 (uses the v4 schema). ServiceInstall is core, so no extension is needed.
          dotnet tool install --global wix
          wix build -arch x64 `
            -d "Version=$ver" `
            -d "BinDir=$bindir" `
            -d "ConfigSrc=packaging/config.example.toml" `
            -o "dist/spark-$ver-x64.msi" `
            packaging/windows/spark.wxs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.target }}
          path: dist/*

  # Notarized macOS app DMG (Model A — ADR 0005): the controlling app + embedded NE system extension,
  # built by packaging/macos/build-dmg.sh (the source-of-truth script). Gated behind a repo VARIABLE
  # so the rest of the release still works before the signing secrets are configured — set
  # `vars.MACOS_APP_PACKAGING = 'true'` once these repo SECRETS exist:
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD       base64 of the "Developer ID Application" .p12 + its password
  #   MACOS_PROFILE_APP / MACOS_PROFILE_TUNNEL   base64 of the "Spark macOS App" / "Spark macOS Tunnel" profiles
  #   AC_USERNAME / AC_PASSWORD                  Apple ID + app-specific password for notarytool (team ACZRKC3LQ9)
  package-macos-app:
    name: package macOS app (DMG)
    if: ${{ vars.MACOS_APP_PACKAGING == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen

      - name: Import Developer ID signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/spark-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put the temp keychain on the user search list so codesign/xcodebuild find the identity.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install Developer ID provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.MACOS_PROFILE_APP }}
          PROFILE_TUNNEL: ${{ secrets.MACOS_PROFILE_TUNNEL }}
        run: |
          # Install to both the classic and modern (Xcode 16+) profile dirs; xcodebuild matches the
          # profile by the Name embedded inside (the filename is irrelevant).
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_APP"    | base64 --decode > "$dir/spark-macos-app.provisionprofile"
            echo "$PROFILE_TUNNEL" | base64 --decode > "$dir/spark-macos-tunnel.provisionprofile"
          done

      - name: Build + notarize the DMG
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          export VERSION="${REF_NAME#v}"
          packaging/macos/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-macos-app
          path: dist/*.dmg

  publish:
    name: publish release
    # Wait for build (required) and the optional macOS app job. always() keeps publish running even
    # when package-macos-app is skipped (signing not configured); the explicit checks keep it correct.
    needs: [build, package-macos-app]
    if: ${{ always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
