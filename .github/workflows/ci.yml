# Continuous integration: the same gates run by hand each session (fmt + clippy + tests),
# across all three desktop OSes, plus the stripped-binary size budget.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  # Belt-and-suspenders compile check per desktop target (default features + `-D warnings`),
  # complementing the per-OS `test` jobs (which run `--all-features`). Each target is checked on a
  # host with its native C toolchain: `ring`'s build needs the target's archiver (MSVC `lib.exe` for
  # *-windows-msvc), which isn't available when cross-compiling to MSVC from Linux.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings as errors)
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-D warnings"

  size:
    name: size budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Size budget (< 3 MB stripped per binary)
        run: ./scripts/size-budget.sh
