# Continuous integration: the same gates run by hand each session (fmt + clippy + tests),
# across all three desktop OSes, plus the stripped-binary size budget.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test
        # nextest enforces a per-test timeout (.config/nextest.toml), so a hung test (e.g. a
        # loopback/network test that blocks on Windows) fails fast and is *named* rather than stalling
        # the whole job for many minutes. Respects `#[ignore]` (the live_* tests) like `cargo test`.
        run: cargo nextest run --workspace --all-features
      - name: Doctests
        # nextest does not run doctests; run them separately to keep doc-example coverage.
        run: cargo test --workspace --all-features --doc

  # Belt-and-suspenders compile check per desktop target (default features + `-D warnings`),
  # complementing the per-OS `test` jobs (which run `--all-features`). Each target is checked on a
  # host with its native C toolchain: `ring`'s build needs the target's archiver (MSVC `lib.exe` for
  # *-windows-msvc), which isn't available when cross-compiling to MSVC from Linux.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings as errors)
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-D warnings"

  size:
    name: size budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Size budget (< 3 MB stripped per binary)
        run: ./scripts/size-budget.sh

  # Connection sharing is a standalone workspace so WebRTC crypto features cannot unify into the
  # size-sensitive core/service graph. Gate it independently on every supported desktop OS.
  sharing:
    name: sharing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: spark-sharing
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spark-sharing
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # The Tauri plugin is its own cargo workspace (not in the repo-root `--workspace`), so the `test`
  # job above never builds it. Gate it here. macOS exercises the `service_ipc` unix-socket round-trip
  # test + AppleControl; Windows compiles ServiceControl + the named-pipe branch. Linux is omitted
  # (the Tauri app deps need webkit2gtk system libraries the plugin gate doesn't warrant installing).
  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: gui-tauri/tauri-plugin-spark-vpn
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/tauri-plugin-spark-vpn
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
