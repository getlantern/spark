# Continuous integration: the same gates run by hand each session (fmt + clippy + tests),
# across all three desktop OSes, plus the stripped-binary size budget.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Test
        # nextest enforces a per-test timeout (.config/nextest.toml), so a hung test (e.g. a
        # loopback/network test that blocks on Windows) fails fast and is *named* rather than stalling
        # the whole job for many minutes. Respects `#[ignore]` (the live_* tests) like `cargo test`.
        run: cargo nextest run --workspace --all-features
      - name: Doctests
        # nextest does not run doctests; run them separately to keep doc-example coverage.
        run: cargo test --workspace --all-features --doc

  # Belt-and-suspenders compile check per desktop target (default features + `-D warnings`),
  # complementing the per-OS `test` jobs (which run `--all-features`). Each target is checked on a
  # host with its native C toolchain: `ring`'s build needs the target's archiver (MSVC `lib.exe` for
  # *-windows-msvc), which isn't available when cross-compiling to MSVC from Linux.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check (warnings as errors)
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      # The check above uses default features, so a feature that does not compile on this target was
      # invisible until a release was cut. `prod` is what release.yml ships, so it is what has to be
      # portable — this is the only place a Windows/Linux breakage in a release-only feature (a
      # transport, the kernel-TCP stack) gets caught before a tag.
      - name: Cross-check the shipped feature set
        run: >
          cargo check -p spark-cli -p spark-service --all-targets
          --features prod --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-D warnings"

  size:
    name: size budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Size budget (< 4 MiB stripped per binary)
        run: ./scripts/size-budget.sh

  # Nothing in CI compiled the mobile slices at all, so a change that broke iOS or Android surfaced
  # only when somebody ran build-xcframework.sh or a Gradle build by hand. That is the same blind spot
  # the desktop feature drift grew in — a build path with no gate on it — and it matters more now that
  # all three platforms share one `prod` list: a feature added for desktop lands on the phones too.
  #
  # `cargo check` rather than a full build: it exercises feature resolution and compilation, which is
  # what drift breaks, without paying for linking an xcframework or an .so on every PR. One 64-bit ARM
  # slice per platform — the other architectures differ in codegen, not in what compiles.
  mobile-check:
    name: mobile check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-ios, pkg: spark-apple, features: "--features prod" }
          - { runner: macos-latest, target: aarch64-apple-darwin, pkg: spark-apple, features: "--features prod" }
          # spark-android bakes its feature set into a target-gated dependency, so it takes no --features.
          - { runner: ubuntu-latest, target: aarch64-linux-android, pkg: spark-android, features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # BoringSSL and ring build C for the target, and the runner's NDK toolchain is not on PATH.
      # The clang wrapper is named per API level, so pick the lowest available rather than pinning a
      # number that a future NDK bump could drop.
      - name: Point cc-rs at the Android NDK
        if: matrix.pkg == 'spark-android'
        run: |
          tc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang=$(find "$tc" -name 'aarch64-linux-android*-clang' | sort -V | head -1)
          test -x "$clang" || { echo "no aarch64 NDK clang under $tc"; exit 1; }
          {
            # boring-sys2 reads ANDROID_NDK_HOME specifically and fails the build without it —
            # setting only the cc-rs variables is not enough (found by running this locally).
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "CC_aarch64_linux_android=$clang"
            echo "AR_aarch64_linux_android=$tc/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang"
          } >> "$GITHUB_ENV"

      - name: Check the slice
        run: cargo check -p ${{ matrix.pkg }} --all-targets --target ${{ matrix.target }} ${{ matrix.features }}

  # Connection sharing is a standalone workspace so WebRTC crypto features cannot unify into the
  # size-sensitive core/service graph. Gate it independently on every supported desktop OS.
  sharing:
    name: sharing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: spark-sharing
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spark-sharing
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # The Tauri plugin is its own cargo workspace (not in the repo-root `--workspace`), so the `test`
  # job above never builds it. Gate it here. macOS exercises the `service_ipc` unix-socket round-trip
  # test + AppleControl; Windows compiles ServiceControl + the named-pipe branch. Linux is omitted
  # (the Tauri app deps need webkit2gtk system libraries the plugin gate doesn't warrant installing).
  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: gui-tauri/tauri-plugin-spark-vpn
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui-tauri/tauri-plugin-spark-vpn
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
