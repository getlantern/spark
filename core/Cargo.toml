[package]
name = "spark-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "spark_core"
path = "src/lib.rs"

[dependencies]
netstack-smoltcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tun-rs.workspace = true
async-trait.workspace = true
socket2.workspace = true
libc.workspace = true
bytes.workspace = true
tracing.workspace = true
serde.workspace = true
toml.workspace = true
# JSON for the Lantern `config_raw.json` adapter (config::lantern). Pure-Rust, no C deps.
serde_json.workspace = true
thiserror.workspace = true
ring.workspace = true
md-5.workspace = true
# Canonical (deterministic) encoding of a gambit genome for Ed25519 signing (ADR 0006 P2). Same codec
# as the control plane; cross-fleet (Go) canonicalization is a noted open question in the design doc.
postcard.workspace = true
# Opening-handshake wire shaping (tcp_split + record_fragment), extracted to the reusable flint crate.
# Non-optional: the gambit genome (always compiled) bridges its Layer C to flint_shaping::WirePlan.
flint-shaping = { git = "https://github.com/getlantern/flint", rev = "5ec56d2b7ca7e59717c5752b7edd15ab22e93cea" }
# Chrome-mimicry TLS: the gambit ClientHello genome, JA4, the boring Chrome connector + Profile + the
# JA4 anchor — extracted to flint. Non-optional (gambit/ja4/profile are always compiled, e.g. by
# `config` and `discovery`); the boring connector rides flint-tls's `boring` feature, enabled by
# spark's `anytls`. Pinned to the same rev as flint-shaping (flint-tls path-depends on it).
flint-tls = { git = "https://github.com/getlantern/flint", rev = "5ec56d2b7ca7e59717c5752b7edd15ab22e93cea" }
# AnyTLS mimicry TLS backend (BoringSSL) — optional; only the `anytls` feature pulls the C build.
# `pq-experimental` exposes Chrome's post-quantum group X25519MLKEM768; `cert-compression` exposes
# brotli cert compression — both part of the Chrome ClientHello profile.
boring2 = { workspace = true, optional = true, features = ["pq-experimental", "cert-compression"] }
tokio-boring2 = { workspace = true, optional = true }
# FFI access for the Samizdat kID SessionID-injection seam (ADR 0007 §5); pulled by `samizdat` only.
boring-sys2 = { workspace = true, optional = true }
foreign-types-shared = { workspace = true, optional = true }
# HTTP/2 CONNECT mux for the Samizdat transport (ADR 0007 §4); pulled by `samizdat` only.
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# wasmi: the Path B dynamic-transport runtime (ADR 0003). Optional — only the `wasm-transport`
# feature pulls it, so the base build carries no WASM interpreter.
wasmi = { workspace = true, optional = true }
# Signed-blob verification (Ed25519 + versioned framing + anti-rollback), extracted from this crate's
# wasm `signing.rs` into the reusable flint crate. Only the `wasm-transport` feature pulls it.
flint-verify = { git = "https://github.com/getlantern/flint", rev = "5ec56d2b7ca7e59717c5752b7edd15ab22e93cea", optional = true }
# Bootstrap control-plane name resolution (design: docs/bootstrap-resolver-design.md). flint-dial
# supplies happy-eyeballs racing (race_with / race_windowed); flint-dns supplies the un-poisoned DoH
# resolver + the A/AAAA codec + answer validation. Both optional — only the `bootstrap-dns` feature
# pulls them (and the boring Chrome connector they dial over). Same rev as the other flint crates.
flint-dial = { git = "https://github.com/getlantern/flint", rev = "5ec56d2b7ca7e59717c5752b7edd15ab22e93cea", optional = true }
flint-dns = { git = "https://github.com/getlantern/flint", rev = "5ec56d2b7ca7e59717c5752b7edd15ab22e93cea", optional = true }
blake3 = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
quinn-udp = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Mozilla CA certs loaded into the boring `tls_wrap` connector (probe + config-fetch) so cert
# verification works on Android/iOS; pulled by `anytls` (the feature that compiles `tls_wrap`).
webpki-root-certs = { workspace = true, optional = true }

[dev-dependencies]
# Assembles the inline WebAssembly-text fixture for the wasm-transport round-trip tests.
wat.workspace = true

[features]
# AnyTLS-over-BoringSSL transport (ADR 0001). Off by default so the base build stays rustls/ring-only
# and free of the C/cmake BoringSSL build.
anytls = ["dep:boring2", "dep:tokio-boring2", "dep:webpki-root-certs", "flint-tls/boring"]
# System (kernel-TCP) netstack — a second Netstack impl (NAT redirect gateway to a kernel listener).
# Off by default; needs a Linux/macOS-style tun fd (Linux, macOS, Android via VpnService — not iOS).
# See docs/system-stack-design.md.
system-stack = []
# Path B dynamic transport (ADR 0003): a wasmi-hosted byte-transform module. Off by default so the
# base build carries no WASM runtime. See docs/dynamic-transports-design.md §8.4.
wasm-transport = ["dep:wasmi", "dep:flint-verify"]
# Un-poisoned control-plane DNS for startup (design: docs/bootstrap-resolver-design.md). Pulls
# flint-dns/flint-dial with their boring Chrome-mimicry connector, so a proxy `server` can be a
# hostname resolved before the tunnel exists. Off by default — the base build stays boring/cmake-free.
bootstrap-dns = ["dep:flint-dial", "dep:flint-dns", "flint-dial/boring", "flint-dns/boring"]
# Samizdat transport (ADR 0007): REALITY-style auth in the TLS SessionID + H2 CONNECT mux,
# interoperable with deployed lantern-box `"samizdat"` servers. `auth.rs` needs only `ring`; the
# `session_id.rs` kID-injection seam pulls the boring TLS backend + its FFI; `h2`/`http` provide the
# CONNECT mux.
samizdat = [
    "anytls", # reuse the Chrome boring connector (`flint_tls::connector`) + `flint_tls::Profile`
    "dep:boring-sys2",
    "dep:foreign-types-shared",
    "dep:h2",
    "dep:http",
]
# Latency-selecting multi-server pool (design: docs/multi-server-selection-design.md). Pulls
# flint-dial for windowed probing. https callbacks additionally need `anytls` (boring TLS).
multi-server = ["dep:flint-dial"]
# Fetch config from the Lantern config-new API (design: docs/config-new-fetch-design.md). Pulls
# `anytls` for the boring TLS the hand-rolled HTTP client uses, and `multi-server` because the adapter
# always maps a `config_raw.json` response into a `transport.servers` pool — without `multi-server`
# `from_config_with_control` errors at connect. `serde_json` (already a dep) parses the JSON. Hostname
# pool members additionally need `bootstrap-dns` (a build-level add, like the config_raw file path).
# Off by default; the Apple (iOS + iOS-sim + macOS) and Android shim builds enable it — BoringSSL
# cross-compiles for all those targets, so the fetch uses one uniform (cert-verifying) BoringSSL
# handshake on every platform with no second TLS stack. NB: v1 uses a *plain* boring connector
# (probe::tls_wrap), not the Chrome-mimicking flint connector — Chrome-mimicry for the fetch is the
# deferred fronting milestone (config-new-fetch-design.md §9). See docs/config-fetch-cross-platform-design.md.
config-fetch = ["anytls", "multi-server"]
# Shadowsocks 2022 (SIP022) transport (ADR 0009): a pre-shared-key AEAD tunnel interoperable with
# deployed shadowsocks-rust servers. `ring` provides the AEADs; `blake3` derives session subkeys and
# `aes` provides the raw block cipher for the UDP separate-header. Off by default so the base build
# stays rustls/ring-only and cmake-free. See docs/shadowsocks-design.md.
shadowsocks = ["dep:blake3", "dep:aes"]
# Hysteria 2 transport (ADR 0010): QUIC (quinn/rustls-ring) client interoperable with apernet/hysteria,
# with Salamander+Gecko obfuscation. Off by default so the base build pulls no QUIC stack.
hysteria2 = ["dep:quinn", "dep:quinn-udp", "dep:blake2", "dep:webpki-roots"]
