[package]
name = "spark-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "spark_core"
path = "src/lib.rs"

[dependencies]
netstack-smoltcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tun-rs.workspace = true
async-trait.workspace = true
socket2.workspace = true
libc.workspace = true
bytes.workspace = true
tracing.workspace = true
# `Layer` trait used by `DiagLayer` (diag::layer). Deliberately NOT workspace-inherited: the
# workspace pin enables env-filter (and defaults pull fmt/ansi), none of which core needs — and
# the Apple NE links core standalone (see log_bridge.rs), so this trimmed feature set is what
# that size-sensitive graph gets. registry+std is exactly enough for Layer composition.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde.workspace = true
toml.workspace = true
# JSON for the Lantern `config_raw.json` adapter (config::lantern). Pure-Rust, no C deps.
serde_json.workspace = true
thiserror.workspace = true
# Pure-Rust zlib for inflating sing-box `.srs` rule-sets; only the `smart-routing` feature pulls it.
flate2 = { workspace = true, optional = true }
ring.workspace = true
md-5.workspace = true
# Canonical (deterministic) encoding of a gambit genome for Ed25519 signing (ADR 0006 P2). Same codec
# as the control plane; cross-fleet (Go) canonicalization is a noted open question in the design doc.
postcard.workspace = true
# Opening-handshake wire shaping (tcp_split + record_fragment), extracted to the reusable flint crate.
# Non-optional: the gambit genome (always compiled) bridges its Layer C to flint_shaping::WirePlan.
flint-shaping = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32" }
# Chrome-mimicry TLS: the gambit ClientHello genome, JA4, the boring Chrome connector + Profile + the
# JA4 anchor — extracted to flint. Non-optional (gambit/ja4/profile are always compiled, e.g. by
# `config` and `discovery`); the boring connector rides flint-tls's `boring` feature, enabled by
# spark's `anytls`. Pinned to the same rev as flint-shaping (flint-tls path-depends on it).
flint-tls = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32" }
# AnyTLS mimicry TLS backend (BoringSSL) — optional; only the `anytls` feature pulls the C build.
# `pq-experimental` exposes Chrome's post-quantum group X25519MLKEM768; `cert-compression` exposes
# brotli cert compression — both part of the Chrome ClientHello profile.
boring2 = { workspace = true, optional = true, features = ["pq-experimental", "cert-compression"] }
tokio-boring2 = { workspace = true, optional = true }
# FFI access for the Samizdat kID SessionID-injection seam (ADR 0007 §5); pulled by `samizdat` only.
boring-sys2 = { workspace = true, optional = true }
foreign-types-shared = { workspace = true, optional = true }
# HTTP/2 CONNECT mux for the Samizdat transport (ADR 0007 §4); pulled by `samizdat` only.
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# wasmi: the Path B dynamic-transport runtime (ADR 0003). Optional — only the `wasm-transport`
# feature pulls it, so the base build carries no WASM interpreter.
wasmi = { workspace = true, optional = true }
# Signed-blob verification (Ed25519 + versioned framing + anti-rollback), extracted from this crate's
# wasm `signing.rs` into the reusable flint crate. Only the `wasm-transport` feature pulls it.
flint-verify = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true }
# Bootstrap control-plane name resolution (design: docs/bootstrap-resolver-design.md). flint-dial
# supplies happy-eyeballs racing (race_with / race_windowed); flint-dns supplies the un-poisoned DoH
# resolver + the A/AAAA codec + answer validation. Both optional — only the `bootstrap-dns` feature
# pulls them (and the boring Chrome connector they dial over). Same rev as the other flint crates.
flint-dial = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true }
flint-dns = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true }
# Domain-fronting transport for the censored cold-start config fetch (config-new-fetch-design.md §9):
# `FrontedTlsDialer` + the one-shot h2 request (`OneshotRequest`/`HttpResponse`), seeded from the
# embedded `domainfront/fronted.yaml.gz` (aliyun/akamai/cloudfront). The `boring` feature pulls the
# Chrome dial path (flint-dial/flint-dns boring). Only `config-fetch` pulls it; same rev as the others.
flint-fronted = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true, features = ["boring"] }
# Rust Kindling: the self-bootstrapping `FrontedBootstrap` (scan local fronts -> race -> one-shot h2),
# the fronted entry point for reaching the config API. Augments the embedded fronted.yaml.gz one-shot
# with live-scanned edges so a fully-blocked front list self-heals. Only `config-fetch` pulls it; the
# `boring` feature rides flint-fronted's Chrome dial path. Same rev as the other flint crates.
flint-kindling = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true, features = ["boring"] }
# The connection-race primitives `flint-kindling` is built on. Declared directly because
# `config.race_member` matches on `AttemptOutcome`: naming the crate the type comes from is plainer
# than relying on kindling's re-export, and it means a kindling refactor that drops the re-export
# is a compile error here rather than a silent loss of the per-member health signal.
flint-transport = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true }
# Proxyless: the `resolver × wire-shaping` strategy search (ADR 0014). `boring` because selecting a
# strategy means proving it with a certificate-verified handshake, which needs the Chrome dial path.
# Same rev as the other flint crates — a mixed rev would resolve to two checkouts and fail on type
# identity.
flint-proxyless = { git = "https://github.com/getlantern/flint", rev = "3af281b2e64d20520dfa3dcc6e820ee9faf2cf32", optional = true, features = ["boring"] }
blake3 = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
chacha20 = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true }
# Sans-io BIP324 core; the egress splitter uses `verify_side_door_tag_with` to classify tunnel clients.
bip324-core = { path = "../bip324-core", optional = true }
quinn = { workspace = true, optional = true }
quinn-udp = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Mozilla CA certs loaded into the boring `tls_wrap` connector (probe + config-fetch) so cert
# verification works on Android/iOS; pulled by `anytls` (the feature that compiles `tls_wrap`).
webpki-root-certs = { workspace = true, optional = true }
# The pure, no-I/O DNS-tunnel protocol core (framing, ARQ, DNS codec, crypto, MTU) shared with the
# server (ADR 0011). Only the `dns-tunnel` feature pulls it (+ its lz4_flex); base build unaffected.
dns-tunnel-core = { path = "../dns-tunnel-core", optional = true }

# Windows loop-prevention (W2b): pin the proxy's own upstream sockets to the physical egress
# interface so they bypass the full-tunnel routes.
# - windows-sys: raw setsockopt(IP_UNICAST_IF/IPV6_UNICAST_IF) — socket2 0.6 doesn't expose
#   bind_device_by_index on Windows. Version matches service/ (single 0.61.x in the tree).
# - getifaddrs: safe interface enumeration (name/index/flags) — avoids hand-written
#   GetAdaptersAddresses FFI. Already in the tree via tun-rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
getifaddrs = "0.6"

# Same crate, now also on Linux/Android: the system stack must find which interface holds the TUN
# address so it can bind its redirect listener to that device. On Android the TUN arrives from
# VpnService as a bare fd with no queryable name, so matching by address is the only handle. Not a
# new dependency — it is already in the graph via tun-rs and used on Windows above; this only links
# it for another target, in preference to hand-rolling the `libc::getifaddrs` FFI a third time.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
getifaddrs = "0.6"

[dev-dependencies]
# Assembles the inline WebAssembly-text fixture for the wasm-transport round-trip tests.
wat.workspace = true
# Inherit the workspace tokio pin; add `test-util` (not in the workspace's `full` set) for the
# stall-guard tests' `tokio::time::pause/advance` + `start_paused`.
tokio = { workspace = true, features = ["test-util"] }

[features]
# AnyTLS-over-BoringSSL transport (ADR 0001). Off by default so the base build stays rustls/ring-only
# and free of the C/cmake BoringSSL build.
anytls = ["dep:boring2", "dep:tokio-boring2", "dep:webpki-root-certs", "flint-tls/boring"]
# System (kernel-TCP) netstack — a second Netstack impl (NAT redirect gateway to a kernel listener).
# Off by default; needs a Linux/macOS-style tun fd (Linux, macOS, Android via VpnService — not iOS).
# See docs/system-stack-design.md.
system-stack = []
# Rule-based smart-routing + ad-block: parse sing-box `.srs` rule-sets and route flows
# Direct/Proxy/Reject (design: docs/superpowers/specs/2026-07-01-spark-smart-routing-ad-block-design.md).
# Off by default; pulls pure-Rust zlib (flate2/miniz_oxide) for `.srs` inflate. Mobile shims enable it.
smart-routing = ["dep:flate2"]
# Path B dynamic transport (ADR 0003): a wasmi-hosted byte-transform module. Off by default so the
# base build carries no WASM runtime. See docs/dynamic-transports-design.md §8.4.
wasm-transport = ["dep:wasmi", "dep:flint-verify", "dep:chacha20"]
# BIP324 host crypto primitives (ADR 0013 §7 step 2): secp256k1 + ElligatorSwift + X-only ECDH, exposed
# as WASM `env` host fns. Pulls the C-backed rust-bitcoin `secp256k1` crate, so — like `anytls` (boring) —
# it's off by default and the base build stays C-free (docs/GOAL.md). Implies `wasm-transport` (the
# primitives are wasm host fns).
bip324 = ["wasm-transport", "dep:secp256k1", "dep:bip324-core"]
# Offline module-signing tool (`sign-module` bin, ADR 0013 §7 step 4). Compiles `signing::sign_artifact`
# + the dev keypair so scripts/build-module.sh can turn a compiled `.wasm` into a signed `.spkw`. Off by
# default — a build/dev tool, never in a shipped binary; the private key stays out of the release surface.
module-signer = ["wasm-transport"]
# Un-poisoned control-plane DNS for startup (design: docs/bootstrap-resolver-design.md). Pulls
# flint-dns/flint-dial with their boring Chrome-mimicry connector, so a proxy `server` can be a
# hostname resolved before the tunnel exists. Off by default — the base build stays boring/cmake-free.
# `dep:webpki-root-certs` because the DoH dial pins its own trust anchors: empty roots mean
# BoringSSL's `set_default_paths()`, which finds nothing on Android/iOS.
bootstrap-dns = ["dep:flint-dial", "dep:flint-dns", "flint-dial/boring", "flint-dns/boring", "dep:webpki-root-certs", "dep:boring2"]
# Samizdat transport (ADR 0007): REALITY-style auth in the TLS SessionID + H2 CONNECT mux,
# interoperable with deployed lantern-box `"samizdat"` servers. `auth.rs` needs only `ring`; the
# `session_id.rs` kID-injection seam pulls the boring TLS backend + its FFI; `h2`/`http` provide the
# CONNECT mux.
samizdat = [
    "anytls", # reuse the Chrome boring connector (`flint_tls::connector`) + `flint_tls::Profile`
    "dep:boring-sys2",
    "dep:foreign-types-shared",
    "dep:h2",
    "dep:http",
]
# Latency-selecting multi-server pool (design: docs/multi-server-selection-design.md). Pulls
# flint-dial for windowed probing. https callbacks additionally need `anytls` (boring TLS).
multi-server = ["dep:flint-dial"]
# Fetch config from the Lantern config-new API (design: docs/config-new-fetch-design.md). Pulls
# `anytls` for the boring TLS the hand-rolled HTTP client uses, and `multi-server` because the adapter
# always maps a `config_raw.json` response into a `transport.servers` pool — without `multi-server`
# `from_config_with_control` errors at connect. `serde_json` (already a dep) parses the JSON. Hostname
# pool members additionally need `bootstrap-dns` (a build-level add, like the config_raw file path).
# Off by default; the Apple (iOS + iOS-sim + macOS) and Android shim builds enable it — BoringSSL
# cross-compiles for all those targets, so the fetch uses one uniform (cert-verifying) BoringSSL
# handshake on every platform with no second TLS stack. The fetch races a *direct* plain-boring TLS
# request (probe::tls_wrap, HTTP/1.1) against two *fronted* one-shot h2 avenues: flint-fronted's
# FrontedTlsDialer over the embedded domainfront config (aliyun/akamai/cloudfront), and the
# vantage-point scanner (flint-kindling's `FrontedBootstrap`) that discovers live edges from the user's
# own network — so a fully-blocked embedded front list self-heals (config-new-fetch-design.md §9).
# `dep:flint-fronted` pulls the fronting transport + its boring dial path; `dep:flint-kindling` pulls
# the scanner bootstrap. See docs/config-fetch-cross-platform-design.md.
# `flate2` decodes the gzip the config API returns when asked (3.2x on the measured payload).
config-fetch = ["anytls", "multi-server", "dep:flint-fronted", "dep:flint-kindling", "dep:flint-transport", "dep:flate2"]
# Domain-fronted meek polling transport (Shir-o-Khorshid CDN-fronting, no MITM).
# Pulls flint-fronted (with its boring Chrome dial path) for fronting + the meek
# polling client + the vantage-point scanner (Akamai local-DNS + CloudFront/Aliyun
# prefix sampling). Self-bootstrapping; needs no server address. See
# docs/fronted-meek-design.md.
fronted-meek = ["dep:flint-fronted"]
# Proxyless transport (ADR 0014): reach destinations directly — no proxy, no exit hop — via an
# un-poisoned resolver plus opening-handshake shaping the local network does not block. Pulls
# flint-proxyless (the resolver × shaping search) and flint-dns (the resolver pool it searches over);
# the `boring` feature rides flint-proxyless's dial path, which the strategy search needs to verify a
# candidate's certificate. Off by default: it has no exit hop, so it must be opted into.
# `anytls` is required, not incidental: the transport's whole security property is a
# **certificate-verified** handshake, and verifying needs trust anchors. `Space::roots` empty makes
# flint fall back to BoringSSL's `set_default_paths()`, and BoringSSL ships no store — on macOS the
# certificates live in the Keychain, which it does not read, so every candidate fails verification
# instantly and the search looks like a blocked network. `anytls` supplies `webpki-root-certs` (and
# direct `boring2`) so the anchors can be pinned. It costs almost nothing here: flint-proxyless
# already pulls the boring stack via its own `boring` feature, so only the root set is new.
proxyless = ["anytls", "dep:flint-proxyless", "dep:flint-dns"]
# Shadowsocks 2022 (SIP022) transport (ADR 0009): a pre-shared-key AEAD tunnel interoperable with
# deployed shadowsocks-rust servers. `ring` provides the AEADs; `blake3` derives session subkeys and
# `aes` provides the raw block cipher for the UDP separate-header. Off by default so the base build
# stays rustls/ring-only and cmake-free. See docs/shadowsocks-design.md.
# `chacha20` is for the UDP half of `2022-blake3-chacha20-poly1305`, whose SS-2022 UDP packets are
# sealed with XChaCha20-Poly1305 — a 24-byte-nonce variant `ring` does not provide. Only the HChaCha20
# key-derivation step comes from here; the AEAD itself is still ring's `CHACHA20_POLY1305`. Not a new
# dependency: `wasm-transport` already pulls the same crate and pin.
shadowsocks = ["dep:blake3", "dep:aes"]
# Native SIP022 UDP (the on-wire datagram envelopes), OFF by default: the deployed fleet answers
# native UDP with ICMP port-unreachable, so shadowsocks tunnels UDP over its TCP stream (UoT) instead.
# Kept because it is correct, tested, and the right path the moment a server does open UDP — the
# `chacha20` dependency is only for that build's XChaCha20-Poly1305 envelope.
shadowsocks-native-udp = ["shadowsocks", "dep:chacha20"]
# Hysteria 2 transport (ADR 0010): QUIC (quinn/rustls-ring) client interoperable with apernet/hysteria,
# with Salamander+Gecko obfuscation. Off by default so the base build pulls no QUIC stack.
hysteria2 = ["dep:quinn", "dep:quinn-udp", "dep:blake2", "dep:webpki-roots"]
# DNS-tunnel transport (ADR 0011): a clean-slate DNS-tunnelling protocol that aggregates over many
# recursive resolvers. Pulls the shared `dns-tunnel-core` crate (+ its pure-Rust lz4_flex). Off by
# default so the base build stays free of DNS-tunnel code. See docs/dns-tunnel-design.md.
dns-tunnel = ["dep:dns-tunnel-core"]

# The set every shipping build carries, on every platform — desktop, Apple and Android. Defined here,
# in the crate that owns the features, because it was previously written out three times: a `prod`
# list in cli/ and service/, a shell variable in platforms/apple/build-xcframework.sh, and a
# dependency array in platforms/android/Cargo.toml. Three hand-maintained copies of one idea drift,
# and they had: desktop shipped for months without transports the phones carried.
#
# A config naming a transport the binary lacks is a hard error at transport-build time, by design —
# spark refuses rather than silently degrading — so a gap here is a pool entry that works on one
# platform and fails on another.
#
# Deliberately NOT here, because they are genuinely per-platform rather than shared:
#   - `system-stack`: needs a tun fd the platform can hand over. Desktop and Android add it; the
#     Apple build does not, because one feature list covers its iOS slices too and they would then
#     advertise a capability they cannot provide.
#   - `bip324`: gated on a pinned module-signing key, so each build adds it conditionally.
#   - `module-signer`: offline tooling that signs with a private key. Never in a shipped binary.
prod = [
    "anytls",
    "shadowsocks",
    "samizdat",
    "hysteria2",
    "dns-tunnel",
    "proxyless",
    "fronted-meek",
    "multi-server",
    "bootstrap-dns",
    "config-fetch",
    "smart-routing",
]

# Offline tool that signs a compiled `.wasm` into a `.spkw` artifact (scripts/build-module.sh). Not a
# product binary — `required-features` keeps it out of every normal/release build.
[[bin]]
name = "sign-module"
path = "src/bin/sign-module.rs"
required-features = ["module-signer"]
